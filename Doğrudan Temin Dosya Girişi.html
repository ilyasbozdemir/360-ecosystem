<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="utf-8">
  <title>Doğrudan Temin Dosya Girişi & Şablonlar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      --bg: #f1f4f9;
      --card: #fff;
      --tx: #172033;
      --mu: #6b7589;
      --br: #e2e7f0;
      --ac: #2563eb;
      --ac2: #eaf1ff;
      --sh: 0 1px 2px #1b2a4a14, 0 6px 18px #1b2a4a0d
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1319;
        --card: #181e27;
        --tx: #e8ecf3;
        --mu: #8e99ad;
        --br: #2a3341;
        --ac: #6b9cff;
        --ac2: #1c2a47;
        --sh: none
      }
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased
    }

    /* --- Layout: Sidebar + Main Content --- */
    .app-wrap {
      display: flex;
      min-height: 100vh
    }

    .sidebar {
      width: 270px;
      min-width: 270px;
      background: var(--card);
      border-right: 1px solid var(--br);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 100;
      box-shadow: var(--sh)
    }

    .sidebar-head {
      padding: 14px 14px 10px;
      border-bottom: 1px solid var(--br)
    }

    .sidebar-head h1 {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    h1::before {
      content: "\1F4C1"
    }

    .sidebar-file-box {
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .sidebar-file-box select {
      width: 100%;
      font-size: 13px;
      font-weight: 500
    }

    .sidebar-file-actions {
      display: flex;
      gap: 4px
    }

    .sidebar-file-actions button {
      flex: 1;
      font-size: 12px;
      padding: 6px 4px
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 10px 10px 6px
    }

    nav button {
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--mu);
      padding: 7px 11px;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s
    }

    nav button:hover {
      background: var(--ac2);
      color: var(--ac)
    }

    nav button.on {
      background: var(--ac);
      color: #fff;
      box-shadow: 0 2px 8px #2563eb44
    }

    nav button .cnt {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--ac2);
      color: var(--ac);
      font-weight: 600
    }

    nav button.on .cnt {
      background: rgba(255, 255, 255, 0.25);
      color: #fff
    }

    /* Sidebar Templates Explorer */
    .sidebar-tpl-wrap {
      border-top: 1px solid var(--br);
      padding: 10px 10px 6px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
      overflow-y: auto;
      min-height: 220px
    }

    .sidebar-tpl-wrap::-webkit-scrollbar {
      width: 4px
    }

    .sidebar-tpl-wrap::-webkit-scrollbar-thumb {
      background: var(--br);
      border-radius: 4px
    }

    .sidebar-sec-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--mu);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 4px;
      margin-bottom: 2px
    }

    .sidebar-tpl-tree {
      display: flex;
      flex-direction: column;
      gap: 3px
    }

    .tpl-group {
      margin-bottom: 3px;
      border-radius: 6px
    }

    .tpl-group-title {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--tx);
      padding: 5px 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 6px;
      user-select: none;
      transition: background .12s
    }

    .tpl-group-title:hover {
      background: var(--ac2);
      color: var(--ac)
    }

    .tpl-group-title .cnt {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 999px;
      background: var(--br);
      color: var(--mu)
    }

    .tpl-items {
      display: flex;
      flex-direction: column;
      gap: 1px;
      padding-left: 6px;
      margin-top: 2px
    }

    .tpl-item {
      font-size: 11.5px;
      color: var(--mu);
      padding: 4px 6px;
      border-radius: 5px;
      text-align: left;
      border: none;
      background: transparent;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      transition: all .12s
    }

    .tpl-item:hover {
      background: var(--ac2);
      color: var(--ac)
    }

    .tpl-item.active {
      background: var(--ac);
      color: #fff;
      font-weight: 600
    }

    .tpl-item .tag {
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 4px;
      background: #10b98122;
      color: #059669;
      margin-left: auto
    }

    .tpl-item.active .tag {
      background: rgba(255, 255, 255, 0.25);
      color: #fff
    }

    .sidebar-foot {
      padding: 10px 14px;
      border-top: 1px solid var(--br);
      background: var(--card);
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .main-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0
    }

    /* Top bar */
    .top-bar {
      position: sticky;
      top: 0;
      background: var(--card);
      border-bottom: 1px solid var(--br);
      padding: 10px 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      z-index: 90;
      box-shadow: var(--sh)
    }

    .menu-toggle {
      display: inline-flex;
      font-size: 16px;
      padding: 6px 10px;
      cursor: pointer
    }

    .top-title {
      font-weight: 600;
      font-size: 13.5px;
      color: var(--tx);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 320px
    }

    .sb-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 95;
      backdrop-filter: blur(2px)
    }

    /* Standard buttons & inputs */
    button,
    select,
    input,
    textarea {
      font: inherit;
      color: var(--tx);
      background: var(--card);
      border: 1px solid var(--br);
      border-radius: 8px;
      padding: 8px 10px;
      transition: border-color .15s, box-shadow .15s
    }

    button {
      cursor: pointer;
      font-weight: 500
    }

    button:hover {
      border-color: var(--ac);
      background: var(--ac2)
    }

    button.p {
      background: var(--ac);
      color: #fff;
      border-color: var(--ac);
      box-shadow: 0 1px 3px #2563eb55
    }

    button.p:hover {
      background: var(--ac);
      filter: brightness(1.1)
    }

    button.s {
      padding: 4px 9px;
      font-size: 12px;
      border-radius: 6px
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 0;
      border-color: var(--ac);
      box-shadow: 0 0 0 3px var(--ac2)
    }

    /* Main area & cards */
    main {
      padding: 16px 20px 40px;
      max-width: 1300px;
      width: 100%;
      margin: 0 auto
    }

    .card {
      background: var(--card);
      border: 1px solid var(--br);
      border-radius: 14px;
      box-shadow: var(--sh);
      padding: 16px;
      margin-bottom: 14px
    }

    .card h2 {
      font-size: 15px;
      font-weight: 650;
      margin: 0 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--br)
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 12px
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      color: var(--mu);
      font-weight: 500
    }

    label input,
    label select,
    label textarea {
      color: var(--tx);
      font-size: 14px;
      width: 100%
    }

    .w {
      grid-column: 1/-1
    }

    .sc {
      overflow-x: auto;
      border: 1px solid var(--br);
      border-radius: 8px;
      margin-top: 6px
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 620px
    }

    th,
    td {
      border: 1px solid var(--br);
      padding: 6px 8px
    }

    th {
      background: var(--ac2);
      color: var(--ac);
      font-size: 12px;
      font-weight: 600;
      text-align: left
    }

    td input {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      padding: 4px 6px;
      border-radius: 4px
    }

    td input:focus {
      background: var(--card);
      box-shadow: inset 0 0 0 2px var(--ac)
    }

    td.n {
      width: 36px;
      text-align: center;
      color: var(--mu)
    }

    .card tr:nth-child(even) td {
      background: color-mix(in srgb, var(--ac2) 35%, transparent)
    }

    #ixl tr:hover td {
      background: var(--ac2)
    }

    .bar {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
      align-items: center
    }

    dialog {
      background: var(--card);
      color: var(--tx);
      border: 1px solid var(--br);
      border-radius: 14px;
      box-shadow: 0 12px 40px #0004;
      width: min(660px, 94vw);
      padding: 18px
    }

    dialog textarea {
      width: 100%;
      height: 220px
    }

    .hide {
      display: none
    }

    .mu {
      color: var(--mu);
      font-size: 12px
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600
    }

    /* A4 Print layout */
    .a4 {
      width: 210mm;
      max-width: 100%;
      margin: 0 auto 12px;
      padding: 14mm;
      background: #fff;
      color: #111;
      box-shadow: 0 2px 12px #0003;
      font-size: 12px;
      border-radius: 4px
    }

    .a4 table {
      min-width: 0;
      width: 100%
    }

    .a4 th,
    .a4 td {
      border: 1px solid #999;
      padding: 3px 5px;
      color: #111;
      background: #fff;
      vertical-align: top
    }

    .a4 th {
      background: #eef1f6;
      font-size: 11px
    }

    .rk th {
      width: 18%
    }

    .rk td {
      width: 32%
    }

    .a4 tr {
      break-inside: avoid
    }

    .a4 h3 {
      font-size: 13px;
      background: #e9edf5;
      padding: 4px 6px;
      margin: 14px 0 6px;
      border-left: 4px solid #1d5fd1;
      color: #111;
      break-after: avoid
    }

    .a4 h4 {
      margin: 10px 0 4px;
      font-size: 12px;
      color: #111
    }

    .rh {
      text-align: center;
      border-bottom: 2px solid #111;
      padding-bottom: 8px;
      margin-bottom: 6px
    }

    .rh b {
      font-size: 17px;
      display: block
    }

    .rh span {
      font-size: 12px
    }

    .a4 .mu {
      color: #666
    }

    /* Responsive & Mobile Drawer */
    @media (max-width:768px) {
      .menu-toggle {
        display: inline-flex
      }

      .top-title {
        display: none
      }

      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
        transition: transform .2s ease
      }

      .sidebar.open {
        transform: translateX(0)
      }

      .sb-overlay.open {
        display: block
      }

      main {
        padding: 10px 8px 40px
      }

      .card {
        border-radius: 12px;
        padding: 12px
      }

      .grid {
        grid-template-columns: 1fr
      }

      #ixl th:nth-child(n+5):nth-child(-n+7),
      #ixl td:nth-child(n+5):nth-child(-n+7) {
        display: none
      }

      .a4 {
        padding: 5mm;
        width: 100%;
        box-shadow: none;
        font-size: 11px
      }

      .a4 table:not(.rk) {
        display: block;
        overflow-x: auto
      }

      .rk,
      .rk tbody,
      .rk tr,
      .rk th,
      .rk td {
        display: block;
        width: 100% !important
      }

      .rk th {
        border-bottom: 0
      }

      .rk tr {
        margin-bottom: 4px
      }
    }

    .drop {
      border: 2px dashed var(--br);
      border-radius: 12px;
      padding: 22px;
      text-align: center;
      color: var(--mu);
      cursor: pointer;
      transition: all .15s
    }

    .drop:hover,
    .drop.over {
      border-color: var(--ac);
      background: var(--ac2);
      color: var(--ac)
    }

    .ek-ic {
      font-size: 18px;
      text-align: center;
      width: 36px
    }

    td select {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      padding: 4px 6px
    }

    .formcard {
      border: 2px solid var(--ac)
    }

    .sec-t {
      grid-column: 1/-1;
      font-weight: 650;
      font-size: 13px;
      color: var(--ac);
      border-bottom: 1px solid var(--br);
      padding: 6px 0 2px;
      margin-top: 4px
    }

    .wide td,
    .wide th {
      white-space: nowrap
    }

    .wide td.wr {
      white-space: normal;
      min-width: 180px
    }

    .best {
      background: #10b98122 !important
    }

    td.ro {
      background: color-mix(in srgb, var(--ac2) 60%, transparent) !important;
      color: var(--mu);
      white-space: nowrap
    }

    #ixl th.act,
    #ixl td.act {
      position: sticky;
      right: 0;
      z-index: 2;
      background: var(--card) !important;
      box-shadow: -8px 0 8px -8px #0003
    }

    #ixl td.act {
      white-space: normal;
      min-width: 230px
    }

    #ixl td.act button {
      margin: 1px
    }

    button.del {
      color: #dc2626;
      border-color: #dc262655
    }

    button.del:hover {
      background: #dc262615;
      border-color: #dc2626
    }

    .fcb {
      position: relative
    }

    .fcl {
      position: absolute;
      left: 0;
      right: 0;
      top: 100%;
      z-index: 60;
      background: var(--card);
      border: 1px solid var(--br);
      border-radius: 8px;
      max-height: 280px;
      overflow: auto;
      box-shadow: 0 10px 28px #0004;
      margin-top: 2px
    }

    .fcl>div {
      padding: 7px 10px;
      cursor: pointer;
      border-bottom: 1px solid var(--br);
      font-size: 13px;
      color: var(--tx)
    }

    .fcl>div:hover {
      background: var(--ac2)
    }

    .lbl {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      color: var(--mu);
      font-weight: 500
    }

    .lbl input {
      width: 100%;
      font-size: 14px
    }

    .kpi {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px
    }

    .kpi .badge {
      font-size: 12px;
      padding: 4px 10px
    }

    /* === Sidebar: gruplu menü, daraltma, mobil iyileştirmeler === */
    .sidebar {
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      transition: margin-left .2s ease, visibility .2s
    }

    nav {
      flex: 0 1 auto;
      min-height: 120px;
      overflow-y: auto;
      overscroll-behavior: contain
    }

    nav::-webkit-scrollbar {
      width: 4px
    }

    nav::-webkit-scrollbar-thumb {
      background: var(--br);
      border-radius: 4px
    }

    .sidebar-tpl-wrap {
      overscroll-behavior: contain
    }

    .nav-grp {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 6px
    }

    .nav-grp-b {
      display: flex;
      flex-direction: column;
      gap: 3px
    }

    .nav-grp.closed .nav-grp-b {
      display: none
    }

    nav button.nav-grp-h {
      width: 100%;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--mu);
      padding: 4px 6px;
      border-radius: 6px
    }

    nav button.nav-grp-h .chev {
      font-size: 11px;
      transition: transform .15s
    }

    .nav-grp.closed .chev {
      transform: rotate(-90deg)
    }

    .sb-close {
      margin-left: auto;
      padding: 2px 9px;
      font-size: 14px;
      line-height: 1.3;
      cursor: pointer
    }

    body.sb-lock {
      overflow: hidden
    }

    @media (min-width:769px) {
      .app-wrap.sb-hidden .sidebar {
        margin-left: -270px;
        visibility: hidden
      }
    }

    @media (max-width:768px) {
      .sidebar {
        width: min(86vw, 320px);
        min-width: 0;
        visibility: hidden;
        transition: transform .2s ease, visibility 0s linear .2s
      }

      .sidebar.open {
        visibility: visible;
        transition: transform .2s ease, visibility 0s
      }

      .sidebar-head {
        padding-top: calc(14px + env(safe-area-inset-top, 0px))
      }

      .sidebar-foot {
        padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px))
      }
    }

    @media (pointer:coarse) {
      nav button {
        min-height: 42px
      }

      nav button.nav-grp-h {
        min-height: 38px
      }

      .sb-close {
        min-width: 40px;
        min-height: 36px
      }
    }

    @media print {
      @page {
        size: A4;
        margin: 12mm
      }

      .sidebar,
      .top-bar,
      .menu-toggle,
      .sb-overlay,
      .bar,
      dialog {
        display: none !important
      }

      .app-wrap,
      .main-wrap,
      main {
        display: block !important;
        padding: 0 !important;
        margin: 0 !important;
        max-width: none !important
      }

      body {
        background: #fff
      }

      .a4 {
        width: auto !important;
        padding: 0 !important;
        box-shadow: none !important;
        margin: 0 !important
      }
    }
  </style>
</head>

<body>

  <div class="app-wrap">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sb">
      <div class="sidebar-head">
        <h1>Dosya Girişi<button type="button" class="sb-close" onclick="toggleSidebar()" title="Menüyü gizle"
            aria-label="Menüyü gizle">«</button></h1>
        <div class="sidebar-file-box">
          <select id="sel" title="Aktif Dosya"></select>
          <div class="sidebar-file-actions">
            <button onclick="tab='idx';closeSidebarMobile();draw()">🗂 Dosya Listesi (Yeni / Sil / Düzenle)</button>
          </div>
        </div>
      </div>

      <!-- Ana Navigasyon Sekmeleri -->
      <nav id="nav"></nav>

      <!-- Yan Menü Şablon Gezgini (Templates Explorer) -->
      <div class="sidebar-tpl-wrap" id="sbTplWrap">
        <div class="sidebar-sec-title">
          <span>📜 Şablon Havuzu</span>
          <div style="display:flex;align-items:center;gap:4px">
            <span class="badge" id="sbTplBadge" style="background:var(--ac2);color:var(--ac)"
              title="Toplam Şablon">55</span>
            <button class="s" onclick="downloadAllFromGithub()" style="padding:1px 6px;font-size:10px"
              title="GitHub Raw'dan Şablonları Otomatik İndir / Senkronize Et">☁</button>
            <button class="s" onclick="toggleAllGroups()" style="padding:1px 6px;font-size:10px"
              title="Tüm Grupları Aç / Kapat">↕</button>
          </div>
        </div>
        <div style="padding:1px 0 4px">
          <input type="text" id="sbTplSearch" placeholder="🔍 Şablon ara..." oninput="filterSidebarTpl(this.value)"
            style="width:100%;font-size:11.5px;padding:5px 8px;border-radius:6px">
        </div>
        <div id="sbTplTree" class="sidebar-tpl-tree"></div>
      </div>

      <div class="sidebar-foot"><span id="st" class="mu">Hazır</span></div>
    </aside>

    <!-- MOBILE OVERLAY BACKDROP -->
    <div class="sb-overlay" id="sbOverlay" onclick="toggleSidebar()"></div>

    <!-- MAIN AREA -->
    <div class="main-wrap">
      <header class="top-bar">
        <button class="menu-toggle" onclick="toggleSidebar()" title="Menüyü Aç/Kapat">☰ Menü</button>
        <span class="top-title" id="curTitle">Dosya</span>
        <span style="flex:1"></span>
        <button onclick="copyPageLink()" title="Bu sayfanın bağlantısını kopyala">🔗 Bağlantı</button>
        <button onclick="openIO()" class="p">Aktar / Yapıştır</button>

    const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    function head() {

      const f = cur();
      const getCount = (t) => {
        if (t === 'idx') return db.files.length;

        if (t === 'win') return f.win ? f.win.length : 0;

      };
      const tabMap = Object.fromEntries(TABS.map(t => [t[0], t]));
      const usedK = new Set(TAB_GROUPS.flatMap(g => g[2]));

    function tbl(rows, cols, title, key) { // rows: array ref
      const body = rows.map((r, i) => `<tr>${cols.map((c, j) => c.endsWith("*") ? `<td class="n">${i + 1}</td>` : c.endsWith("~") ? `<td class="ro" title="Firma tekliflerinden otomatik gelir">${c.startsWith("Birim Fiyat") && num(r[j]) ? money(num(r[j])) : esc(r[j]) || '<span class="mu">teklif bekleniyor</span>'}</td>` : `<td><input data-r="${i}" data-c="${j}" value="${esc(r[j])}"></td>`).join("")}<td class="n"><button class="s" data-del="${i}">×</button></td></tr>`).join("");

 <div class="bar"><button class="s" data-add>+ Satır</button><button class="s" data-paste>Excel'den yapıştır</button><span class="mu">Excel'den satırları kopyalayıp aktarın; sütunlar sırayla eşleşir.</span></div>
 <textarea class="hide" rows="5" style="width:100%;margin-top:6px" placeholder="Excel'den kopyaladığınız hücreleri buraya yapıştırın, sonra dışarı tıklayın"></textarea></div>`}

    function bind(root, getRows, colsOf) {
      root.querySelectorAll(".card[data-k]").forEach(card => {
        const k = card.dataset.k, rows = getRows(k), cols = colsOf(k);
        card.addEventListener("input", e => { const d = e.target.dataset; if (d.r != null) { rows[d.r][d.c] = e.target.value; save() } });
        card.addEventListener("click", e => {
          const d = e.target.dataset;
          if (d.del != null) { rows.splice(d.del, 1); save(); draw() }
          if (d.add != null) { rows.push(cols.map(() => "")); save(); draw() }
          if (d.paste != null) { const t = card.querySelector("textarea"); t.classList.toggle("hide"); t.focus() }
        });
        const ta = card.querySelector("textarea"); ta.onchange = () => {
          const idx = cols.map((c, i) => /[*~]$/.test(c) ? -1 : i).filter(i => i >= 0);
          let ls = ta.value.split(/\r?\n/).filter(l => l.trim());
          if (ls.length && ls[0].split(/\t|;/)[0].trim().toLowerCase() == cols[idx[0]].toLowerCase()) ls.shift();
          ls.forEach(l => { const p = l.split(/\t|;/); const r = cols.map(() => ""); idx.forEach((ci, n) => r[ci] = (p[n] ?? "").trim()); rows.push(r) });
          save(); draw()
        }
      })
    }

    /* ================= DOĞRUDAN TEMİN HTML DOSYA GİRİŞİ FORMU AKTARIMI ================= */
    let dfLastMsg = '';

    function isDosyaFormHTML(txt) {
      if (!txt || typeof txt !== 'string') return false;
      if (!/<[a-z][\s\S]*>/i.test(txt)) return false;
      const patterns = [
        /<form\b/i,
        /name=["'](dosyatarihi|butce_yili|vdosyaadi|visinniteligi|dtNo|ihalesi_yapilacak_birim|sMakam|vihaletipi|vihaleturu|vihalesekli_dt|sonTeklifTarih|irtibatPersonel|kurumsalKod)["']/i,
        /id=["'](dosyatarihi|butce_yili|vdosyaadi|visinniteligi|dtNo|ihalesi_yapilacak_birim|sMakam|vihaletipi|vihaleturu|sonTeklifTarih|irtibatPersonel|kurumsalKod)["']/i,
        /(dosya\s*açılış\s*tarihi|doğrudan\s*temin\s*numarası|işin\s*adı\s*\/\s*tanımı|ihalesi\s*yapılacak\s*birim|sunulacak\s*makam)/i
      ];
      return patterns.some(p => p.test(txt));
    }

    function dosyaFormImpHTML() {
      return `<div class="card" style="background:var(--ac2);border:1px solid var(--ac);margin-bottom:12px">

          </div>
          ${dfLastMsg ? `<div id="dfMsg" style="margin-top:6px"><span class="badge" style="background:#10b98122;color:#059669;font-size:12.5px">${esc(dfLastMsg)}</span></div>` : '<div id="dfMsg" style="margin-top:6px"></div>'}

    function dfFile(i) {
      const r = new FileReader();

    function dfImpClick() {
      const t = (document.getElementById('dfTa') || {}).value || '';

      draw();

      if (msgEl) msgEl.innerHTML = `<span class="badge" style="background:#10b98122;color:#059669;font-size:12.5px">${esc(res.msg)}</span>`;
      st.textContent = res.msg;
    }

    function dosyaFormParse(txt) {
      const doc = new DOMParser().parseFromString(txt, 'text/html');
      const result = { f: {}, sablon: {}, matchedCount: 0, matchedFields: [] };

      const getVal = (el) => {
        if (!el) return null;
        const tag = el.tagName.toUpperCase();
        if (tag === 'SELECT') {
          const opt = el.querySelector('option[selected]') || (el.selectedIndex >= 0 ? el.options[el.selectedIndex] : null) || el.querySelector('option');
          if (!opt) return (el.value || '').trim();
          const text = opt.textContent.replace(/\s+/g, ' ').trim();
          const val = (opt.value || '').trim();
          return { text, val };
        }
        if (tag === 'TEXTAREA') return (el.value || el.textContent || '').trim();
        if (tag === 'INPUT') {
          const type = (el.type || 'text').toLowerCase();
          if (type === 'checkbox' || type === 'radio') return el.checked ? (el.value || 'Evet') : 'Hayır';
          return (el.value || el.getAttribute('value') || '').trim();
        }
        return (el.textContent || '').replace(/\s+/g, ' ').trim();
      };

      const findEl = (names) => {
        for (const n of names) {
          const el = doc.querySelector(`[name="${n}" i], #${n}`);
          if (el) return el;
        }
        return null;
      };

      const findByLabel = (labelPattern) => {
        const labels = doc.querySelectorAll('label, .formLabel, th, td.formLabel');
        for (const lbl of labels) {
          const t = lbl.textContent.replace(/\s+/g, ' ').trim();
          if (labelPattern.test(t)) {
            const forId = lbl.getAttribute('for');
            if (forId) {
              const el = doc.getElementById(forId) || doc.querySelector(`[name="${forId}" i]`);
              if (el) return el;
            }
            const group = lbl.closest('.form-group, tr, td, div');
            if (group) {
              const allInputs = group.querySelectorAll('input:not([type=hidden]):not([type=button]):not([type=submit]), select, textarea');
              if (allInputs.length === 1) return allInputs[0];
              let sibling = lbl.nextElementSibling;
              while (sibling) {
                const inp = sibling.matches('input, select, textarea') ? sibling : sibling.querySelector('input:not([type=hidden]):not([type=button]):not([type=submit]), select, textarea');
                if (inp) return inp;
                sibling = sibling.nextElementSibling;
              }
              if (allInputs.length > 0) return allInputs[0];
            }
          }
        }
        return null;
      };

      const setF = (fieldName, rawVal) => {
        if (rawVal == null) return;
        let val = typeof rawVal === 'object' && rawVal.text !== undefined ? rawVal.text : String(rawVal);
        val = val.trim();
        if (!val && typeof rawVal === 'object' && rawVal.val) val = rawVal.val.trim();
        if (val !== undefined && val !== null) {
          result.f[fieldName] = val;
          result.matchedCount++;
          result.matchedFields.push(fieldName);
        }
      };

      const toDate = (v) => {
        if (!v) return '';
        const raw = typeof v === 'object' ? (v.val || v.text) : String(v);
        const m = raw.trim().match(/^(\d{1,2})[\/\.-](\d{1,2})[\/\.-](\d{4})/);
        if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
        if (/^\d{4}-\d{2}-\d{2}/.test(raw.trim())) return raw.trim().slice(0, 10);
        return raw.trim();
      };

      // 1. Dosya Açılış Tarihi
      const elDosyaTarihi = findEl(['dosyatarihi', 'dosya_tarihi', 'dosyaTarih', 'vtarih', 'acilisTarihi']) || findByLabel(/dosya\s*açılış\s*tarihi|açılış\s*tarihi/i);
      if (elDosyaTarihi) setF('Dosya Açılış Tarihi', toDate(getVal(elDosyaTarihi)));

      // 2. Bütçe Yılı
      const elButceYili = findEl(['butce_yili', 'butceyili', 'butceYili', 'vyil']) || findByLabel(/bütçe\s*yılı/i);
      if (elButceYili) {
        const v = getVal(elButceYili);
        setF('Bütçe Yılı', typeof v === 'object' ? (v.text || v.val) : v);
      }

      // 3. Bütçe
      const elButce = findEl(['butce', 'vbutce', 'butceTuru']) || findByLabel(/^bütçe$/i);
      if (elButce) {
        const v = getVal(elButce);
        let bText = typeof v === 'object' ? v.text : v;
        if (bText === '0') bText = 'Genel Bütçe';
        else if (bText === '1') bText = 'Döner Sermaye';
        else if (bText === '3') bText = 'Diğer';
        setF('Bütçe', bText);
      }

      // 4. Doğrudan Temin Numarası
      const elDtNo = findEl(['dtNo', 'dt_no', 'vdtno', 'teminNo', 'temin_no']) || findByLabel(/doğrudan\s*temin\s*numarası|temin\s*no/i);
      if (elDtNo) {
        const v = getVal(elDtNo);
        setF('Doğrudan Temin Numarası', typeof v === 'object' ? (v.val || v.text) : v);
      }

      // 5. Dosya No
      const elDosyaNo = findEl(['dosyano', 'dosya_no', 'vdosyano', 'dosyaNumarasi']) || findByLabel(/^dosya\s*no(su)?$/i);
      if (elDosyaNo) {
        const v = getVal(elDosyaNo);
        setF('Dosya No', typeof v === 'object' ? (v.val || v.text) : v);
      } else {
        const by = result.f['Bütçe Yılı'] || new Date().getFullYear();
        const dt = result.f['Doğrudan Temin Numarası'];
        if (dt) {
          result.f['Dosya No'] = `${by}/${dt}`;
          result.matchedFields.push('Dosya No');
        }
      }

      // Check form action for ID parameter if present (e.g. action="y.php?islem=r&ID=183260")
      const formEl = doc.querySelector('form');
      if (formEl && formEl.action) {
        const idMatch = formEl.action.match(/[?&]ID=([^&#]+)/i);
        if (idMatch && idMatch[1]) {
          result.systemId = idMatch[1];
          if (!result.f['Doğrudan Temin Numarası']) {
            result.f['Doğrudan Temin Numarası'] = idMatch[1];
          }
          if (!result.f['Dosya No']) {
            const by = result.f['Bütçe Yılı'] || new Date().getFullYear();
            result.f['Dosya No'] = `${by}/${idMatch[1]}`;
          }
        }
      }

      // 6. İşin Adı / Tanımı
      const elDosyaAdi = findEl(['vdosyaadi', 'dosyaadi', 'dosya_adi', 'is_adi', 'isin_adi', 'visinadi', 'isinAdi', 'dosyaAdi']) || findByLabel(/işin\s*adı|iş\s*tanımı/i);
      if (elDosyaAdi) setF('İşin Adı / Tanımı', getVal(elDosyaAdi));

      // 7. Açıklama
      const elAciklama = findEl(['visinniteligi', 'isinniteligi', 'aciklama', 'vaciklama', 'isinNiteligi']) || findByLabel(/^açıklama$|işin\s*niteliği/i);
      if (elAciklama) setF('Açıklama', getVal(elAciklama));

      // 8. İhalesi Yapılacak Birim
      const elBirim = findEl(['ihalesi_yapilacak_birim', 'ihale_birim', 'vbirim', 'mudurluk', 'harcama_birimi']) || findByLabel(/ihalesi\s*yapılacak\s*birim|harcama\s*birimi/i);
      if (elBirim) {
        const v = getVal(elBirim);

      }

      // 9. Antet Ek Satır
      const elAntetEk = findEl(['antetEk', 'antetek', 'vantetek', 'antet_ek']) || findByLabel(/antet\s*ek/i);
      if (elAntetEk) {
        const v = typeof getVal(elAntetEk) === 'object' ? getVal(elAntetEk).text : getVal(elAntetEk);
        if (v) {
          result.sablon.antetEk = v;
          result.sablon.hazirlayanPersonelUnvan = v;
          result.f['Antet Ek Satır'] = v;
        }

      // 10. Sunulacak Makam
      const elMakam = findEl(['sMakam', 'smakam', 'makam', 'vmakam', 'sunulacakMakam']) || findByLabel(/sunulacak\s*makam/i);
      if (elMakam) {
        const v = typeof getVal(elMakam) === 'object' ? getVal(elMakam).text : getVal(elMakam);
        setF('Sunulacak Makam', v);
        if (v && (!db.kurum || !db.kurum.kurumAdi)) {

      // 11. İhtiyaç Yeri
      const elIhtiyacYeri = findEl(['ihaleBirim', 'ihtiyacYeri', 'ihtiyac_yeri', 'vihtiyacyeri', 'teslimYeri']) || findByLabel(/ihtiyaç\s*yeri|teslim\s*yeri/i);

      // 13. Kurumsal Kod

      // 14. Fonksiyonel Kod
      const elFonksiyonel = findEl(['fonksiyonelKod', 'fonksiyonelkod', 'fonksiyonel_kod']) || findByLabel(/fonksiyonel\s*kod/i);
      if (elFonksiyonel) setF('Fonksiyonel Kod', getVal(elFonksiyonel));

      // 15. Finansal Kod
      const elFinansal = findEl(['finansalKod', 'finansalkod', 'finansal_kod']) || findByLabel(/finansal\s*kod/i);
      if (elFinansal) setF('Finansal Kod', getVal(elFinansal));

      // 16. İhale Tipi
      const elIhaleTipi = findEl(['vihaletipi', 'ihaletipi', 'ihale_tipi']) || findByLabel(/ihale\s*tipi/i);
      if (elIhaleTipi) setF('İhale Tipi', getVal(elIhaleTipi));

      // 17. Alım Türü
      const elAlimTuru = findEl(['vihaleturu', 'ihaleturu', 'alim_turu', 'alimTuru']) || findByLabel(/alım\s*türü|ihale\s*türü/i);
      if (elAlimTuru) setF('Alım Türü', getVal(elAlimTuru));

      // 18. Madde
      const elMadde = findEl(['vihalesekli_dt', 'vihalesekli', 'madde']) || findByLabel(/madde/i);
      if (elMadde) setF('Madde', getVal(elMadde));

      // 19. Teklif ve Sözleşme Türü
      const elTeklifSoz = findEl(['vteklifsozlesmeturu', 'teklifsozlesmeturu', 'sozlesmeTuru']) || findByLabel(/teklif\s*ve\s*sözleşme\s*türü/i);
      if (elTeklifSoz) setF('Teklif ve Sözleşme Türü', getVal(elTeklifSoz));

      // 20. Alt yüklenici olacak mı
      const elAltYuk = findEl(['valtyuklenici', 'altyuklenici']) || findByLabel(/alt\s*yüklenici/i);
      if (elAltYuk) setF('Alt yüklenici olacak mı', getVal(elAltYuk));

      // 21. Kısmi teklif verilecek mi
      const elKismi = findEl(['vkismiteklif', 'kismiteklif']) || findByLabel(/kısmi\s*teklif/i);
      if (elKismi) setF('Kısmi teklif verilecek mi', getVal(elKismi));

      // 22. Fiyat Farkı Dayanağı
      const elFiyatFarki = findEl(['vfiyatfarki', 'fiyatfarki']) || findByLabel(/fiyat\s*farkı/i);
      if (elFiyatFarki) {
        const v = getVal(elFiyatFarki);
        let txt = typeof v === 'object' ? v.text : v;
        if (/ödenmeyecek/i.test(txt)) txt = 'Fiyat Farkı Ödenmeyecek';
        else if (/mal\s*alımı/i.test(txt)) txt = '31.08.2013 Tarih ve 2013/5216 Sayılı Mal Alımı BKK';
        else if (/hizmet\s*alımı/i.test(txt)) txt = '31.08.2013 Tarih ve 2013/5215 Sayılı Hizmet Alımı BKK';
        setF('Fiyat Farkı Dayanağı', txt);
      }

      // 23. Yatırım Proje Numarası
      const elProjeNo = findEl(['vyatprojeno', 'yatprojeno', 'projeNo']) || findByLabel(/yatırım\s*proje/i);
      if (elProjeNo) setF('Yatırım Proje Numarası', getVal(elProjeNo));

      // 24. Avans Verilecek mi
      const elAvans = findEl(['vavans', 'avans']) || findByLabel(/avans\s*verilecek/i);
      if (elAvans) setF('Avans Verilecek mi', getVal(elAvans));

      // 25. Yaklaşık Maliyet
      const elYakMal = findEl(['vyaklasikmaliyetsec', 'yaklasikmaliyetsec']) || findByLabel(/yaklaşık\s*maliyet$/i);
      if (elYakMal) {
        const v = getVal(elYakMal);
        let txt = typeof v === 'object' ? v.text : v;
        if (txt === '0' || /burada/i.test(txt)) txt = 'Burada Hesaplanacak';
        else if (txt === '1' || /önceden/i.test(txt)) txt = 'Önceden hesaplandı';
        else if (txt === '2' || /hesaplanmayacak/i.test(txt)) txt = 'Hesaplanmayacak';
        setF('Yaklaşık Maliyet', txt);
      }

      // 26. KDV
      const elKdv = findEl(['kdv', 'vkdv']) || findByLabel(/^kdv$/i);
      if (elKdv) {
        const v = getVal(elKdv);
        let txt = typeof v === 'object' ? v.text : v;
        if (txt === '0' || /hariç/i.test(txt)) txt = 'Hariç';
        else if (txt === '1' || /dahil/i.test(txt)) txt = 'Dahil';
        setF('KDV', txt);
      }

      // 27. Hesaplama Esası
      const elHesapEsasi = findEl(['vhesaplamaesasi', 'hesaplamaesasi']) || findByLabel(/hesaplama\s*esası/i);
      if (elHesapEsasi) {
        const v = getVal(elHesapEsasi);
        let txt = typeof v === 'object' ? v.text : v;
        if (/ortalama/i.test(txt)) txt = 'Ortalama fiyat esasına göre';
        else if (/en\s*düşük/i.test(txt)) txt = 'En düşük fiyat esasına göre';
        setF('Hesaplama Esası', txt);
      }

      // 28. Hesaplamada
      const elHesaplamada = findEl(['vkomisyontakdiri', 'komisyontakdiri']) || findByLabel(/^hesaplamada$|komisyon\s*takdiri/i);
      if (elHesaplamada) {
        const v = getVal(elHesaplamada);
        let txt = typeof v === 'object' ? v.text : v;
        if (/sadece\s*araştırma/i.test(txt)) txt = 'Sadece araştırma fiyatları dikkate alınacak';
        else if (/komisyon\s*takdiri/i.test(txt)) txt = 'Komisyon takdiri kullanılacak';
        else if (/son\s*alım/i.test(txt)) txt = 'Son alım fiyatlarını da kullan';
        setF('Hesaplamada', txt);
      }

      // 29. Tıbbi Cihaz Alımı mı
      const elTibbi = findEl(['tibbiCihazAlimi', 'tibbicihaz']) || findByLabel(/tıbbi\s*cihaz/i);
      if (elTibbi) {
        const v = getVal(elTibbi);
        let txt = typeof v === 'object' ? v.text : v;
        if (txt === '0' || /hayır/i.test(txt)) txt = 'Hayır';
        else if (txt === '1' || /evet/i.test(txt)) txt = 'Evet';
        setF('Tıbbi Cihaz Alımı mı', txt);
      }

      // 30. İrtibat Yetkilisi
      const elIrtibat = findEl(['irtibatPersonel', 'irtibatYetkilisi', 'irtibat']) || findByLabel(/irtibat\s*yetkilisi|irtibat/i);
      if (elIrtibat) {
        const v = getVal(elIrtibat);
        const pName = typeof v === 'object' ? v.text : v;
        if (pName && pName !== 'Seçiniz') {
          setF('İrtibat Yetkilisi', pName);
          result.sablon.hazirlayanPersonelAdi = pName;
        }
      }

      // 31. Son Teklif Verme Tarih/Saati
      const elStTarih = findEl(['sonTeklifTarih', 'sonTeklifTarihi']) || findByLabel(/son\s*teklif\s*verme/i);
      const elStSaat = findEl(['sonTeklifSaat']);
      if (elStTarih) {
        const dVal = toDate(getVal(elStTarih));
        const sRaw = elStSaat ? (typeof getVal(elStSaat) === 'object' ? getVal(elStSaat).val || getVal(elStSaat).text : getVal(elStSaat)) : '14:00';
        if (dVal) {
          const dtIso = `${dVal}T${(sRaw || '14:00').trim().padStart(5, '0').slice(0, 5)}`;
          setF('Son Teklif Verme Tarih/Saati', dtIso);
        }
      }

      // 32. Tahmini Bitiş Tarihi
      const elBitisTarihi = findEl(['bitisTarihi', 'tahminiBitisTarihi', 'vbitistarihi']) || findByLabel(/tahmini\s*bitiş|bitiş\s*tarihi/i);
      if (elBitisTarihi) setF('Tahmini Bitiş Tarihi', toDate(getVal(elBitisTarihi)));

      // 33. İhale Tarihi
      const elIhaleTarihi = findEl(['ihaleTarihi', 'vihaletarihi']) || findByLabel(/ihale\s*tarihi/i);
      if (elIhaleTarihi) setF('İhale Tarihi', toDate(getVal(elIhaleTarihi)));

      // 34. İhale Aşaması
      const elIhaleAsamasi = findEl(['ihaleAsamasi', 'vihaleasamasi']) || findByLabel(/ihale\s*aşaması/i);
      if (elIhaleAsamasi) setF('İhale Aşaması', getVal(elIhaleAsamasi));

      // Option normalizer based on F
      F.forEach(([fName, fType, fOpts]) => {
        if (fType === 'sel' && Array.isArray(fOpts) && result.f[fName]) {
          const curVal = result.f[fName].trim().toLowerCase();
          const matched = fOpts.find(o => o.toLowerCase() === curVal || o.toLowerCase().startsWith(curVal));
          if (matched) result.f[fName] = matched;
        }
      });

      return result;
    }

    function dosyaFormImport(txt, asNew = false) {
      const parsed = dosyaFormParse(txt);
      if (!parsed.matchedCount) {
        return { ok: false, msg: 'HTML formunda eşleşen Doğrudan Temin alanı bulunamadı.' };
      }

      let targetFile;
      if (asNew) {
        targetFile = blank();
        db.files.push(targetFile);
        db.cur = db.files.length - 1;
      } else {
        targetFile = cur();
      }

      Object.assign(targetFile.f, parsed.f);
      if (!targetFile.sablon) targetFile.sablon = {};
      Object.assign(targetFile.sablon, parsed.sablon);

      let matCount = 0;
      try {
        const mats = matParse(txt);
        if (mats && mats.length) {
          mats.forEach(x => {
            let tas = '', okas = '', kod = x.kod;
            const ex = katFind({ kod: x.kod, ad: x.ad }) || db.katalog.find(z => trl(z.ad) === trl(x.ad));
            if (ex) { tas = ex.tasinir; okas = ex.okas; if (!kod) kod = ex.kod }
            targetFile.mat.push(['', kod, x.ad, x.ozel, x.birim || 'Adet', x.kdv || '20', x.mik || '1', '', '', tas, okas]);
            matCount++;
          });
        }
      } catch (e) { }

      save();
      const summary = `✓ ${parsed.matchedCount} dosya alanı başarıyla aktarıldı: ${targetFile.f['İşin Adı / Tanımı'] || 'Doğrudan Temin'} (${targetFile.f['Dosya No'] || targetFile.f['Doğrudan Temin Numarası'] || ''})${matCount ? ` + ${matCount} malzeme kalemi eklendi` : ''}`;
      return { ok: true, msg: summary, count: parsed.matchedCount, matCount };
    }

    function draw() {
      if (tkCtx && (tab != 'tek' || tkCtx.fi !== db.cur)) tkCtx = null;
      head(); const f = cur(); let h = "";
      if (tab == "idx") h = idxHTML();
      else if (tab == "rapor") h = raporHTML(f);
      else if (tab == "sab") h = sabHTML();
      else if (tab == "ek") h = ekHTML(f);
      else if (tab == "frm") h = frmHTML();
      else if (tab == "tek") h = tekHTML(f, db.cur);
      else if (tab == "tlist") h = tlistHTML();
      else if (tab == "f") {
        h = dosyaFormImpHTML() + `<div class="card"><div class="grid">` + F.map(([n, t, o]) => {
          const v = esc(f.f[n]); const w = o == "w" ? "w" : "";
          if (t == "sel") { const ops = o.map(x => `<option ${f.f[n] == x ? "selected" : ""}>${esc(x)}</option>`).join(""); return `<label>${n}<select data-f="${esc(n)}"><option value=""></option>${ops}</select></label>` }
          if (t == "area") return `<label class="w">${n}<textarea rows="3" data-f="${esc(n)}">${v}</textarea></label>`;
          return `<label class="${w}">${n}<input type="${t}" data-f="${esc(n)}" value="${v}"></label>`
        }).join("") + `</div></div>`
      }

      else if (tab == "kat") h = katHTML();
      else if (tab == "ayar") h = ayarHTML();
      else if (tab == "mat") {

          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <span class="badge" style="background:var(--ac2);color:var(--ac)">Toplam: ${f.mat.length} Kalem</span>
            <span class="badge" style="background:var(--ac2);color:var(--ac)">Miktar: ${totalMiktar}</span>
            <span class="badge" style="background:var(--ac2);color:var(--ac)">Teklife Göre Tutar: ${totalTutar.toLocaleString("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} TL</span>
          </div>
        </div>
      </div>` + matAddHTML() + tbl(f.mat, T.mat[1], T.mat[0], "mat");
      }
      else if (tab == "win") h = winPickHTML() + tbl(f.win, T.win[1], T.win[0], "win") + tbl(f.con, T.con[1], T.con[0], "con");
      else if (tab == "kom") h = komImpHTML("yak") + tbl(f.yak, T.yak[1], T.yak[0], "yak") + komImpHTML("muay") + tbl(f.muay, T.muay[1], T.muay[0], "muay");
      else {
        if (kabI >= f.kab.length) kabI = Math.max(0, f.kab.length - 1);
        kbHash(f); h = kabFirmHTML(f) + kabListHTML(f);
        const k = f.kab[kabI]; if (k) { h += `<div class="card">${kbDetHead(k)}<div class="grid">` + KH.map(n => `<label>${n}<input data-kh="${n}" ${n.includes("Tarihi") ? 'type="date"' : ""} value="${esc(k.h[n])}"></label>`).join("") + `</div></div>` + tbl(k.m, KM, "Malzeme Listesi", "km") }
        else h += `<p class="mu">Henüz tutanak yok.</p>`

      main.innerHTML = h;

      main.querySelectorAll("[data-kh]").forEach(el => el.oninput = () => { f.kab[kabI].h[el.dataset.kh] = el.value; save() });
      main.querySelectorAll("[data-d]").forEach(el => el.oninput = () => { db.defs.f[el.dataset.d] = el.value; save() });
      const ks = document.getElementById("ks"); if (ks) ks.onchange = () => { kabI = +ks.value; draw() };
      bind(main, k => k == "km" ? f.kab[kabI].m : k.startsWith("d_") ? db.defs[k.slice(2)] : f[k], k => k == "km" ? KM : T[k.replace("d_", "")][1]);
      updateSidebarTpl();
      ekBind();

    }

    function ayarHTML() {
      const d = db.defs; const skip = ['Dosya No', 'Doğrudan Temin Numarası'];
      const fl = F.filter(x => !skip.includes(x[0]) && x[1] !== 'date' && x[1] !== 'datetime-local').map(([n, t, o]) => {
        const v = esc(d.f[n]); const e = esc(n);
        if (t === 'sel') return `<label>${n}<select data-d='${e}'><option value=''></option>${o.map(x => `<option ${d.f[n] == x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></label>`;
        if (t === 'area') return `<label class='w'>${n}<textarea rows='3' data-d='${e}'>${v}</textarea></label>`;
        return `<label class='${o === 'w' ? 'w' : ''}'>${n}<input data-d='${e}' value='${v}'></label>`
      }).join('');
      return `<div class='card'><h2>Varsayılan değerler</h2><p class='mu'>Buradakiler yeni açılan her dosyaya otomatik gelir. Dosya açılış tarihi bugün olarak gelir.</p><div class='grid'>${fl}</div><div class='bar'><button class='p' onclick='applyDefs()'>Açık dosyanın boş alanlarına uygula</button><button onclick='curToDefs()'>Açık dosyadan varsayılan al</button></div></div>` + tbl(d.yak, T.yak[1], 'Varsayılan: ' + T.yak[0], 'd_yak') + tbl(d.muay, T.muay[1], 'Varsayılan: ' + T.muay[0], 'd_muay')
    }
    function applyDefs() { const f = cur(), d = db.defs; Object.entries(d.f).forEach(([k, v]) => { if (v && !f.f[k]) f.f[k] = v }); if (!f.yak.length) f.yak = cl(d.yak); if (!f.muay.length) f.muay = cl(d.muay); save(); st.textContent = 'Varsayılanlar açık dosyaya uygulandı' }
    function curToDefs() { const f = cur(), d = db.defs; d.f = {}; F.forEach(([n, t]) => { if (f.f[n] && !['Dosya No', 'Doğrudan Temin Numarası'].includes(n) && t !== 'date' && t !== 'datetime-local') d.f[n] = f.f[n] }); d.yak = cl(f.yak); d.muay = cl(f.muay); save(); draw() }

    let q = '';
    function fmt(v) { v = v || ''; if (/^[0-9]{4}-[0-9]{2}-[0-9]{2}/.test(v)) { const p = v.slice(0, 10).split('-'); v = p[2] + '.' + p[1] + '.' + p[0] + v.slice(10).replace('T', ' ') } return v ? esc(v) : '—' }
    function go(i, t) { db.cur = i; kabI = 0; tab = t; draw() }
    function ixTable() {
      const s = q.toLowerCase();
      const rows = db.files.map((f, i) => ({ f: f, i: i })).filter(o => !s || (JSON.stringify(o.f.f) + JSON.stringify(o.f.win) + JSON.stringify(o.f.mat)).toLowerCase().includes(s));
      return `<table style='min-width:860px'><tr><th style='width:30px'><input type='checkbox' title='Görünenlerin hepsini seç' onclick='ixAll(this.checked)'></th><th>Dosya No</th><th>D.T. No</th><th>Dosya Adı</th><th>Malzeme</th><th>İhale Türü</th><th>İhale Şekli</th><th>İhale Tarihi</th><th>İhale Aşaması</th><th>Teklif</th><th class='act'>İşlem</th></tr>` + rows.map(o => { const x = o.f.f; return `<tr><td class='n'><input type='checkbox' ${ixSel.has(o.f.id) ? 'checked' : ''} onchange='ixTog("${o.f.id}",this.checked)'></td><td>${fmt(x['Dosya No'])}</td><td>${fmt(x['Doğrudan Temin Numarası'])}</td><td>${fmt(x['İşin Adı / Tanımı'])}</td><td><span class="badge" style="background:var(--ac2);color:var(--ac)">${(o.f.mat || []).length} Kalem</span></td><td>${fmt(x['Alım Türü'])}</td><td>${fmt(x['İhale Tipi'])}</td><td>${fmt(x['İhale Tarihi'])}</td><td>${fmt(x['İhale Aşaması'])}</td><td><span class="badge" style="background:var(--ac2);color:var(--ac)">${(o.f.tek || []).filter(tekGeldi).length}/${(o.f.tek || []).length}</span></td><td class='act'><button class='s' onclick='go(${o.i},"f")'>Aç / Güncelle</button> <button class='s' onclick='go(${o.i},"mat")'>Malzeme</button> <button class='s' onclick='go(${o.i},"tek")'>Teklif</button> <button class='s' onclick='go(${o.i},"ozet")'>Özet</button> <button class='s' onclick='go(${o.i},"rapor")'>Rapor</button> <button class='s del' onclick='delFiles(["${o.f.id}"])' title='Dosyayı sil'>🗑 Sil</button></td></tr>` }).join('') + `</table>` + (rows.length ? '' : `<p class='mu'>Kayıt bulunamadı.</p>`)
    }
    const ixSel = new Set();
    function ixBulkLbl() { const b = document.getElementById('ixbulk'); if (b) b.textContent = '🗑 Seçilileri Sil (' + ixSel.size + ')' }
    function ixTog(id, on) { on ? ixSel.add(id) : ixSel.delete(id); ixBulkLbl() }
    function ixAll(on) {
      const sq = q.toLowerCase();
      db.files.forEach(f => { if (!sq || (JSON.stringify(f.f) + JSON.stringify(f.win) + JSON.stringify(f.mat)).toLowerCase().includes(sq)) on ? ixSel.add(f.id) : ixSel.delete(f.id) });
      ixList(); ixBulkLbl();
    }
    function delSel() { if (!ixSel.size) return alert('Önce silinecek dosyaları işaretleyin.'); delFiles([...ixSel]) }
    function delFiles(ids) {
      const list = db.files.filter(f => ids.includes(f.id)); if (!list.length) return;
      const msg = list.length == 1 ? '"' + (list[0].f['Dosya No'] || 'Dosya') + ' — ' + (list[0].f['İşin Adı / Tanımı'] || '') + '" dosyası; malzeme, teklif ve ekleriyle birlikte silinsin mi?' : list.length + ' dosya; malzeme, teklif ve ekleriyle birlikte silinsin mi?';
      if (!confirm(msg)) return;
      const curId = cur().id;
      list.forEach(f => (f.ek || []).forEach(e => idbDel(e.id)));
      db.files = db.files.filter(f => !ids.includes(f.id));
      if (!db.files.length) db.files.push(blank());
      const ni = db.files.findIndex(f => f.id === curId); db.cur = ni >= 0 ? ni : 0; kabI = 0;
      ids.forEach(i => ixSel.delete(i)); save(); draw();
    }
    function ixList() { document.getElementById('ixl').innerHTML = ixTable() }
    function idxHTML() { return `<div class='card'><h2>Dosyalar (${db.files.length})</h2><div class='bar' style='margin:0 0 8px'><input placeholder='Ara: dosya no, iş adı, firma, malzeme...' value='${esc(q)}' oninput='q=this.value;ixList()' style='flex:1;min-width:200px'><button class='p' onclick='newF();tab="f";draw()'>+ Yeni dosya</button><button class='s' onclick='newF();tab="f";draw();setTimeout(()=>{const el=document.getElementById("dfImp");if(el)el.classList.remove("hide");},50)'>📥 HTML Formu ile Dosya Aç</button><button id='ixbulk' class='del' onclick='delSel()'>🗑 Seçilileri Sil (${ixSel.size})</button></div><div class='sc' id='ixl'>${ixTable()}</div></div>` }

    function raporHTML(f) {
      const g = (n, s) => fmt((s || f.f)[n]);
      const kv = (arr, s) => `<table class='rk'>` + arr.map(a => a.length == 1 ? `<tr><th>${a[0]}</th><td colspan='3'>${g(a[0], s)}</td></tr>` : `<tr><th>${a[0]}</th><td>${g(a[0], s)}</td><th>${a[1]}</th><td>${g(a[1], s)}</td></tr>`).join('') + `</table>`;
      const tb = (c, r) => r.length ? `<table><tr>${c.map(x => `<th>${x.replace(/[*~]$/, '')}</th>`).join('')}</tr>${r.map((x, i) => `<tr>${c.map((cc, j) => `<td>${cc.endsWith('*') ? i + 1 : esc(x[j])}</td>`).join('')}</tr>`).join('')}</table>` : `<p class='mu'>Kayıt yok.</p>`;
      const S = (t, b) => `<h3>${t}</h3>${b}`;
      let h = `<div class='bar' style='margin:0 0 8px;justify-content:center'><button class='p' onclick='print()'>Yazdır / PDF (A4)</button></div><div class='a4'><div class='rh'><b>DOĞRUDAN TEMİN DOSYA RAPORU</b><span>${g('İşin Adı / Tanımı')}</span></div>`;
      h += S('1. Genel Bilgiler', kv([['Dosya No', 'Doğrudan Temin Numarası'], ['Dosya Açılış Tarihi', 'Bütçe Yılı'], ['Bütçe', 'İhale Tarihi'], ['İhale Aşaması', 'İhalesi Yapılacak Birim'], ['İşin Adı / Tanımı'], ['Açıklama']]));
      h += S('2. Makam ve Kodlar', kv([['Sunulacak Makam', 'İhtiyaç Yeri'], ['Talep Tarih/Sayısı', 'Yatırım Proje Numarası'], ['Kurumsal Kod', 'Fonksiyonel Kod'], ['Finansal Kod', 'İrtibat Yetkilisi']]));
      h += S('3. İhale Bilgileri', kv([['İhale Tipi', 'Alım Türü'], ['Madde', 'Teklif ve Sözleşme Türü'], ['Alt yüklenici olacak mı', 'Kısmi teklif verilecek mi'], ['Avans Verilecek mi', 'Tıbbi Cihaz Alımı mı'], ['Fiyat Farkı Dayanağı']]));
      h += S('4. Yaklaşık Maliyet ve Süre', kv([['Yaklaşık Maliyet', 'KDV'], ['Hesaplama Esası', 'Son Teklif Verme Tarih/Saati'], ['Hesaplamada'], ['Tahmini Bitiş Tarihi']]));
      h += S('5. Malzeme Listesi (' + f.mat.length + ' Kalem)', tb(T.mat[1].slice(0, 9), f.mat));
      h += S('6. Kazanan Firmalar ve Sözleşmeler', tb(T.win[1], f.win) + '<div style="height:6px"></div>' + tb(T.con[1], f.con));
      h += S('7. Kabul Tutanakları', f.kab.length ? f.kab.map((k, i) => `<h4>Tutanak ${i + 1}</h4>` + kv([['Kabul Tarihi', 'Sayı'], ['Firma', 'Teslim Alan'], ['Teslim Yeri', 'Fatura Tarihi'], ['Fatura No']], k.h) + '<div style="height:4px"></div>' + tb(KM, k.m)).join('') : `<p class='mu'>Kayıt yok.</p>`);
      h += S('8. Yaklaşık Maliyet Tespit Komisyonu', tb(T.yak[1], f.yak));
      h += S('9. Muayene Kabul ve Tespit Komisyonu', tb(T.muay[1], f.muay));
      h += S('10. Ek Dosyalar', (f.ek || []).length ? tb(['Sıra*', 'Dosya Adı', 'Tür', 'Not'], f.ek.map(e => ['', e.ad, e.kat, e.not])) : `<p class='mu'>Kayıt yok.</p>`);
      h += S('11. Teklif Bilgileri', (f.tek || []).length ? tb(['Sıra*', 'Firma No', 'Firma Ünvanı', 'Telefon/Faks/Email', 'Semt Şehir', 'Teklif Tarihi', 'Tutar', 'Durum'], f.tek.map(t => ['', t.firmaNo, t.firma, iletisim(t), yer(t), fmt(t.teklifTarihi).replace('—', ''), tekTutar(t, f) ? money(tekTutar(t, f)) : '', t.durum])) : `<p class='mu'>Kayıt yok.</p>`);
      return h + `<p class='mu' style='text-align:right;margin-top:14px'>Rapor tarihi: ${fmt(new Date().toISOString().slice(0, 10))}</p></div>`
    }



    /* ================= TEKLİF FORMLARI ================= */
    const TEK_DURUM = ["Teklif İstendi", "Teklif Geldi", "Teklif Vermedi", "Kabul Edildi", "Reddedildi"];
    const TEK_SEKIL = ["E-posta", "Elden", "Faks", "Posta/Kargo", "Telefon", "Elektronik (EKAP vb.)", "Diğer"];
    const TEK_RENK = { "Teklif İstendi": "#6b7589", "Teklif Geldi": "#2563eb", "Teklif Vermedi": "#d97706", "Kabul Edildi": "#059669", "Reddedildi": "#dc2626" };
    function num(v) { v = String(v ?? '').trim(); if (v.includes(',')) v = v.replace(/\./g, '').replace(',', '.'); return parseFloat(v) || 0 }
    const money = n => n.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' TL';
    function tekTutar(t, f) { const k = t.kalemler || []; if (k.some(x => num(x) > 0)) return f.mat.reduce((a, m, i) => a + num(m[6]) * num(k[i]), 0); return num(t.tutar) }
    const tekGeldi = t => ['Teklif Geldi', 'Kabul Edildi', 'Reddedildi'].includes(t.durum) || !!t.teklifTarihi;
    const durBadge = d => { const c = TEK_RENK[d] || '#6b7589'; return `<span class="badge" style="background:${c}22;color:${c}">${esc(d || '—')}</span>` };
    const durSel = (fi, t) => `<select style="min-width:130px" onchange="tekSetDur(${fi},'${t.id}',this.value)">${TEK_DURUM.map(d => `<option ${t.durum == d ? 'selected' : ''}>${d}</option>`).join('')}</select>`;
    function tekSetDur(fi, id, v) { const t = db.files[fi].tek.find(x => x.id == id); if (t) { t.durum = v; save(); draw() } }
    const dosyaLbl = f => (f.f['Dosya No'] || 'Dosya No yok') + (f.f['İşin Adı / Tanımı'] ? ' — ' + f.f['İşin Adı / Tanımı'].slice(0, 50) : '');

    function tekHTML(f, fi) {
      const T = f.tek || [], gel = T.filter(tekGeldi);
      const sorted = gel.map(t => ({ t, tu: tekTutar(t, f) })).sort((a, b) => (a.tu || 1e18) - (b.tu || 1e18));
      const min = sorted.find(x => x.tu > 0);
      const yak = f.mat.reduce((a, m) => a + num(m[6]) * num(m[7]), 0);
      const r1 = T.map((t, i) => `<tr><td class="n">${i + 1}</td><td>${esc(t.firmaNo)}</td><td class="wr"><b>${esc(t.firma)}</b><div class="mu">${esc(t.vergiNo ? 'VKN: ' + t.vergiNo : '')}</div></td><td class="wr">${esc(iletisim(t))}</td><td class="wr">${esc(yer(t))}</td><td>${esc(t.yetkili)}</td><td>${fmt(t.istekTarihi)}</td><td>${esc(t.sekil || '—')}</td><td>${durSel(fi, t)}</td><td style="white-space:nowrap"><button class="s" onclick="tekOpen(${fi},'${t.id}')">Düzenle</button> <button class="s" onclick="tekDel(${fi},'${t.id}')">Sil</button></td></tr>`).join('');
      const r2 = sorted.map((x, i) => { const t = x.t; return `<tr class="${min && min.t === t ? 'best' : ''}"><td class="n">${i + 1}</td><td><b>${esc(t.firma)}</b>${min && min.t === t ? ' <span class="badge" style="background:#10b98133;color:#059669">En düşük</span>' : ''}</td><td>${fmt(t.teklifTarihi)}</td><td style="text-align:right;font-weight:600">${x.tu ? money(x.tu) : '—'}</td><td>${esc(t.kdv ? '%' + t.kdv : '—')}</td><td>${esc(t.gecerlilik ? t.gecerlilik + ' gün' : '—')}</td><td>${durBadge(t.durum)}</td><td style="white-space:nowrap"><button class="s" onclick="tekWin(${fi},'${t.id}')">🏆 Kazanan yap</button> <button class="s" onclick="tekOpen(${fi},'${t.id}')">Düzenle</button> <button class="s" onclick="tekDel(${fi},'${t.id}')">Sil</button></td></tr>` }).join('');
      return `<div class="card"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center"><div><h2 style="margin:0;border:none;padding:0">💬 Teklif Formları Girişi</h2><span class="mu">Dosya: <b>${esc(f.f['Dosya No'] || '—')}</b> · ${esc(f.f['İşin Adı / Tanımı'] || '')}</span></div><button class="p" onclick="tekOpen(${fi})">+ Firma / Teklif Ekle</button></div>
        <div class="kpi" style="margin-top:10px"><span class="badge" style="background:var(--ac2);color:var(--ac)">Teklif istenen: ${T.length}</span><span class="badge" style="background:var(--ac2);color:var(--ac)">Gelen teklif: ${gel.length}</span>${min ? `<span class="badge" style="background:#10b98133;color:#059669">En düşük: ${esc(min.t.firma)} — ${money(min.tu)}</span>` : ''}${yak ? `<span class="badge" style="background:var(--ac2);color:var(--ac)">Seçili fiyatlarla malzeme tutarı: ${money(yak)}</span>` : ''}</div></div>
        ${tkCtx && tkCtx.fi === fi ? tekFormHTML() : ''}${fiyatMatris(f)}<div class="card"><h2>📤 Teklif İstenen Firmalar (kimlere verdik)</h2>${T.length ? `<div class="sc"><table class="wide" style="min-width:1000px"><tr><th>#</th><th>Firma No</th><th>Firma Ünvanı</th><th>Telefon/Faks/Email</th><th>Semt Şehir</th><th>Yetkili</th><th>İstek Tarihi</th><th>Şekil</th><th>Durum</th><th></th></tr>${r1}</table></div>` : '<p class="mu">Henüz firma eklenmedi.</p>'}</div>
        <div class="card"><h2>📥 Gelen Teklifler (kimlerden girdi)</h2>${gel.length ? `<div class="sc"><table class="wide" style="min-width:820px"><tr><th>#</th><th>Firma</th><th>Teklif Tarihi</th><th>Tutar (KDV Hariç)</th><th>KDV</th><th>Geçerlilik</th><th>Durum</th><th></th></tr>${r2}</table></div>` : '<p class="mu">Henüz gelen teklif yok. Firma durumunu "Teklif Geldi" yapın veya düzenleyip teklif bilgilerini girin.</p>'}</div>`;
    }

    function tekKalemHTML(fi, kal) {
      const f = db.files[fi]; kal = kal || [];
      if (!f || !f.mat.length) return '<p class="mu w" style="grid-column:1/-1">Bu dosyada malzeme yok; toplam tutarı elle girebilirsiniz.</p>';
      return `<div class="w" style="grid-column:1/-1"><div class="mu" style="margin-bottom:4px">Kalem bazlı birim fiyat girerseniz toplam otomatik hesaplanır (miktar × birim fiyat) ve yukarıdaki tutarın yerine geçer.</div><div class="sc"><table style="min-width:560px"><tr><th>#</th><th>Malzeme</th><th>Birim</th><th>Miktar</th><th>Teklif Birim Fiyat (TL)</th></tr>${f.mat.map((m, i) => `<tr><td class="n">${i + 1}</td><td>${esc(m[2])}</td><td>${esc(m[4])}</td><td>${esc(m[6])}</td><td><input id="tk_k${i}" value="${esc(kal[i])}" oninput="tekCalc()" style="border:1px solid var(--br)"></td></tr>`).join('')}</table></div><div class="mu" style="margin-top:4px">Hesaplanan toplam: <b id="tk_top">—</b></div></div>`;
    }
    function tekCalc() {
      const fi = +document.getElementById('tk_dosya').value, f = db.files[fi]; if (!f) return;
      const k = f.mat.map((_, i) => (document.getElementById('tk_k' + i) || {}).value || '');
      const el = document.getElementById('tk_top'); if (el) el.textContent = k.some(x => num(x) > 0) ? money(f.mat.reduce((a, m, i) => a + num(m[6]) * num(k[i]), 0)) : '—';
    }
    function tekFileChange() { const fi = +document.getElementById('tk_dosya').value; document.getElementById('tk_kal').innerHTML = tekKalemHTML(fi, []); }

    let tkCtx = null;
    const iletisim = t => t.iletisim != null ? t.iletisim : [t.tel && 'T: ' + t.tel, t.faks && 'F: ' + t.faks, t.eposta].filter(Boolean).join(' · ');
    const yer = t => t.yer != null ? t.yer : [t.semt, t.sehir].filter(Boolean).join(' / ');
    function tekOpen(fi, id) { tkCtx = { fi, id: id || null }; db.cur = fi; tab = 'tek'; closeSidebarMobile(); draw(); window.scrollTo(0, 0) }
    function tekCancel() { tkCtx = null; draw() }
    function tekFormHTML() {
      const fi = tkCtx.fi, id = tkCtx.id, f = db.files[fi], t = id ? f.tek.find(x => x.id == id) : null;
      const inp = (lbl, k, fld, type, ph, extra) => `<label>${lbl}<input id="tk_${k}" type="${type || 'text'}" value="${esc(t ? t[fld] : '')}" ${ph ? `placeholder="${ph}"` : ''} ${extra || ''}></label>`;
      const sel = (lbl, k, arr, cur) => `<label>${lbl}<select id="tk_${k}">${arr.map(x => `<option ${cur == x ? 'selected' : ''}>${x}</option>`).join('')}</select></label>`;
      return `<div class="card formcard"><h2>${id ? '✏ Teklif Kaydını Güncelle' : '➕ Yeni Firma / Teklif'}</h2>
        <div class="grid">
          <label class="w">Bağlı Dosya (Dosya No)<select id="tk_dosya" onchange="tekFileChange()">${db.files.map((x, i) => `<option value="${i}" ${i == fi ? 'selected' : ''}>${esc(dosyaLbl(x))}</option>`).join('')}</select></label>
          <div class="sec-t">1) Firma Bilgileri ve Teklif İsteği (kime verdik)</div>
          <label>Firma No<input id="tk_firmano" value="${esc(t ? t.firmaNo : '')}"></label>
          <div class="lbl">Firma Ünvanı * <span class="mu" style="font-weight:400">(yazarak filtrele, listeden seç)</span>${fcbHTML('tk_firma', t ? t.firma : '', 'Firma No / ünvan / şehir ara…', 'tekFirmaSel', "document.getElementById('tk_firmaid').value=''")}<input type="hidden" id="tk_firmaid" value="${esc(t ? t.firmaId : '')}"></div>
          <label>Telefon/Faks/Email<input id="tk_iletisim" value="${esc(t ? iletisim(t) : '')}"></label>
          <label>Semt Şehir<input id="tk_yer" value="${esc(t ? yer(t) : '')}"></label>
          ${inp('Vergi No / TCKN', 'vergi', 'vergiNo')}${inp('Yetkili Adı', 'yetkili', 'yetkili')}
          ${inp('Teklif İstek Tarihi', 'istek', 'istekTarihi', 'date')}${sel('Teklif İsteme Şekli', 'sekil', TEK_SEKIL, t && t.sekil)}
          <div class="sec-t">2) Gelen Teklif (kimden girdi)</div>
          ${sel('Teklif Durumu', 'durum', TEK_DURUM, t ? t.durum : 'Teklif İstendi')}${inp('Teklif Geliş Tarihi', 'tt', 'teklifTarihi', 'date')}
          ${inp('Teklif Tutarı (KDV hariç, TL)', 'tutar', 'tutar', 'text', 'Kalem fiyatı girilmezse buradan')}${inp('KDV Oranı (%)', 'kdv', 'kdv')}${inp('Teklif Geçerlilik (gün)', 'gec', 'gecerlilik')}
          <label class="w">Not<textarea id="tk_not" rows="2">${esc(t ? t.not : '')}</textarea></label>
          <div id="tk_kal" style="grid-column:1/-1">${tekKalemHTML(fi, t && t.kalemler)}</div>
        </div>
        <div class="bar"><button class="p" onclick="tekSave()">Kaydet</button><button onclick="tekCancel()">İptal</button></div></div>`;
    }
    function tekSave() {
      const g = id => (document.getElementById(id) || {}).value?.trim() || '';
      const firma = g('tk_firma'); if (!firma) return alert('Firma ünvanı zorunludur.');

    }
    function tekDel(fi, id) { if (!confirm('Bu teklif kaydı silinsin mi?')) return; const f = db.files[fi]; f.tek = f.tek.filter(x => x.id != id); save(); draw() }
    function tekWin(fi, id) {

    /* ---- Tüm dosyaların teklif listesi (geniş ekran) ---- */
    let tq = '', tdur = '', tdos = '', tsort = 'dosya';
    function tlRows() {
      const s = tq.toLowerCase(); const out = [];
      db.files.forEach((f, fi) => { if (tdos !== '' && +tdos !== fi) return; (f.tek || []).forEach(t => { if (tdur && t.durum !== tdur) return; if (s && !(JSON.stringify(t) + (f.f['Dosya No'] || '') + (f.f['İşin Adı / Tanımı'] || '')).toLowerCase().includes(s)) return; out.push({ f, fi, t, tu: tekTutar(t, f) }) }) });
      if (tsort === 'tutar') out.sort((a, b) => (a.tu || 1e18) - (b.tu || 1e18)); else if (tsort === 'firma') out.sort((a, b) => a.t.firma.localeCompare(b.t.firma, 'tr'));

    }
    function tlTable() {

      return `<table class="wide" style="min-width:1400px"><tr><th>#</th><th>Dosya No</th><th>Dosya Adı</th><th>Firma No</th><th>Firma Ünvanı</th><th>VKN</th><th>Telefon/Faks/Email</th><th>Semt Şehir</th><th>Yetkili</th><th>İstek Tarihi</th><th>Şekil</th><th>Teklif Tarihi</th><th>Tutar (KDV Hariç)</th><th>Durum</th><th>İşlem</th></tr>` + R.map((r, i) => { const t = r.t; return `<tr><td class="n">${i + 1}</td><td><a href="#" onclick="go(${r.fi},'tek');return false"><b>${esc(r.f.f['Dosya No'] || '—')}</b></a></td><td class="wr">${esc(r.f.f['İşin Adı / Tanımı'] || '')}</td><td>${esc(t.firmaNo)}</td><td class="wr"><b>${esc(t.firma)}</b></td><td>${esc(t.vergiNo)}</td><td class="wr">${esc(iletisim(t))}</td><td class="wr">${esc(yer(t))}</td><td>${esc(t.yetkili)}</td><td>${fmt(t.istekTarihi)}</td><td>${esc(t.sekil || '—')}</td><td>${fmt(t.teklifTarihi)}</td><td style="text-align:right">${r.tu ? money(r.tu) : '—'}</td><td>${durSel(r.fi, t)}</td><td><button class="s" onclick="tekOpen(${r.fi},'${t.id}')">Düzenle</button> <button class="s" onclick="tekDel(${r.fi},'${t.id}')">Sil</button></td></tr>` }).join('') + `</table>` + (R.length ? `<p class="mu" style="padding:6px 8px">${R.length} kayıt · Toplam teklif tutarı: <b>${money(top)}</b></p>` : '<p class="mu" style="padding:8px">Kayıt bulunamadı.</p>');
    }
    function tlList() { document.getElementById('tl').innerHTML = tlTable() }
    function tlistHTML() {
      return `<div class="card"><h2>📑 Teklif Listesi — Tüm Dosyalar</h2><div class="bar" style="margin:0 0 10px">
        <input placeholder="Ara: firma, dosya no, iş adı, VKN..." value="${esc(tq)}" oninput="tq=this.value;tlList()" style="flex:1;min-width:200px">
        <select onchange="tdos=this.value;tlList()" style="max-width:260px"><option value="">Tüm dosyalar</option>${db.files.map((f, i) => `<option value="${i}" ${tdos !== '' && +tdos === i ? 'selected' : ''}>${esc(dosyaLbl(f))}</option>`).join('')}</select>
        <select onchange="tdur=this.value;tlList()"><option value="">Tüm durumlar</option>${TEK_DURUM.map(d => `<option ${tdur == d ? 'selected' : ''}>${d}</option>`).join('')}</select>
        <select onchange="tsort=this.value;tlList()"><option value="dosya" ${tsort == 'dosya' ? 'selected' : ''}>Sırala: Dosya</option><option value="firma" ${tsort == 'firma' ? 'selected' : ''}>Sırala: Firma</option><option value="tutar" ${tsort == 'tutar' ? 'selected' : ''}>Sırala: En düşük tutar</option></select>
        <button class="p" onclick="tekOpen(db.cur)">+ Yeni Teklif</button><button onclick="tlCSV()">Excel (CSV)</button></div>
        <div class="sc" id="tl">${tlTable()}</div></div>`;
    }
    function tlCSV() {
      const q = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
      const H = ["Dosya No", "Dosya Adı", "Firma No", "Firma Ünvanı", "VKN", "Yetkili", "Telefon/Faks/Email", "Semt Şehir", "İstek Tarihi", "İstek Şekli", "Teklif Tarihi", "Tutar (KDV Hariç)", "KDV %", "Geçerlilik (gün)", "Durum", "Not"];
      const L = [H.map(q).join(';')]; tlRows().forEach(r => { const t = r.t; L.push([r.f.f['Dosya No'], r.f.f['İşin Adı / Tanımı'], t.firmaNo, t.firma, t.vergiNo, t.yetkili, iletisim(t), yer(t), t.istekTarihi, t.sekil, t.teklifTarihi, r.tu || '', t.kdv, t.gecerlilik, t.durum, t.not].map(q).join(';')) });

    /* ---- Birim fiyat: firma tekliflerinden otomatik ---- */
    function syncFiyat(f) {
      const T = (f.tek || []).filter(t => (t.kalemler || []).some(x => num(x) > 0));
      f.mat.forEach((m, i) => {
        const c = T.map(t => ({ t, p: num((t.kalemler || [])[i]) })).filter(x => x.p > 0);
        const win = c.filter(x => x.t.durum === 'Kabul Edildi');
        const pool = win.length ? win : c.filter(x => tekGeldi(x.t));
        if (pool.length) { const b = pool.reduce((a, x) => x.p < a.p ? x : a); m[7] = String(b.p); m[8] = b.t.firma + (win.length ? ' (kazanan)' : ' (en düşük)') }
        else if (/\((kazanan|en düşük)\)$/.test(m[8] || '')) { m[7] = ''; m[8] = '' }
      });
    }
    /* Excel benzeri fiyat giriş tablosu: satır = malzeme, sütun = teklif istenen firma */
    function fiyatMatris(f) {
      const fi = db.files.indexOf(f), T = f.tek || [], H = '<div class="card"><h2>💲 Fiyat Giriş Tablosu (kalem × firma)</h2>';
      if (!f.mat.length) return H + '<p class="mu">Önce 📦 Malzemeler sekmesinden malzeme ekleyin.</p></div>';
      if (!T.length) return H + '<p class="mu">Önce teklif istenen firmaları ekleyin (<b>+ Firma / Teklif Ekle</b>); her firma bu tabloda bir sütun olur.</p></div>';
      const rows = f.mat.map((m, i) => {
        const ps = T.map(t => num((t.kalemler || [])[i])), mn = Math.min(...ps.filter(p => p > 0), Infinity);
        return `<tr><td class="n">${i + 1}</td><td class="wr">${esc(m[2])}</td><td style="white-space:nowrap">${esc(m[6])} ${esc(m[4])}</td>${T.map((t, ti) => `<td style="padding:0" class="${ps[ti] > 0 && ps[ti] === mn ? 'best' : ''}"><input class="fgi" id="fg_${ti}_${i}" data-ti="${ti}" data-i="${i}" inputmode="decimal" value="${esc((t.kalemler || [])[i])}" oninput="fgSet(${fi},${ti},${i},this.value)" onchange="fgChange()" onkeydown="fgKey(event,${T.length})" onpaste="fgPaste(event,${fi},${ti},${i})" style="text-align:right;min-width:110px;background:transparent;border:1px solid var(--br);border-radius:0"></td>`).join('')}</tr>`;
      }).join('');
      return H + `<p class="mu">Teklif istenen her firma bir sütundur. Birim fiyatı (KDV hariç) hücreye yazın; Enter/↓/↑ ile satır, Tab ile sütun değiştirirsiniz. Excel’den hücre bloğu kopyalayıp bir hücreye yapıştırabilirsiniz. Fiyat girilen “Teklif İstendi” firmalar otomatik “Teklif Geldi” olur.</p>
        <div class="sc"><table class="wide" style="min-width:600px"><tr><th>#</th><th>Malzeme</th><th>Miktar</th>${T.map(t => `<th style="min-width:130px">${esc(t.firma)}${t.durum === 'Kabul Edildi' ? ' 🏆' : ''}<div style="margin-top:3px">${durBadge(t.durum)}</div><button class="s" style="margin-top:3px" onclick="tekWin(${fi},'${t.id}')">🏆 Kazanan yap</button></th>`).join('')}</tr>${rows}<tr style="font-weight:700"><td></td><td>TOPLAM (KDV hariç)</td><td></td>${T.map((t, ti) => `<td id="fgt_${ti}" style="text-align:right">${money(tekTutar(t, f))}</td>`).join('')}</tr></table></div><p class="mu">Yeşil: kalemdeki en düşük fiyat.</p></div>`;
    }
    function fgSet(fi, ti, i, v) {
      const f = db.files[fi], t = f.tek[ti]; if (!t) return;
      if (!t.kalemler) t.kalemler = []; while (t.kalemler.length < f.mat.length) t.kalemler.push('');
      t.kalemler[i] = v.trim(); save(); fgRefresh(fi);
    }
    function fgRefresh(fi) {
      const f = db.files[fi];
      f.tek.forEach((t, ti) => { const e = document.getElementById('fgt_' + ti); if (e) e.textContent = money(tekTutar(t, f)) });
      f.mat.forEach((m, i) => { const ps = f.tek.map(t => num((t.kalemler || [])[i])), mn = Math.min(...ps.filter(p => p > 0), Infinity); ps.forEach((p, ti) => { const e = document.getElementById(`fg_${ti}_${i}`); if (e) e.parentElement.classList.toggle('best', p > 0 && p === mn) }) });
    }
    function fgPromote() { let ch = false; (cur().tek || []).forEach(t => { if (t.durum === 'Teklif İstendi' && (t.kalemler || []).some(x => num(x) > 0)) { t.durum = 'Teklif Geldi'; ch = true } }); return ch }
    function fgChange() {
      if (!fgPromote()) return; save();
      setTimeout(() => { const id = document.activeElement && document.activeElement.id; draw(); const e = id && document.getElementById(id); if (e) { e.focus(); e.select && e.select() } }, 0);
    }
    function fgKey(e, nt) {
      const el = e.target, ti = +el.dataset.ti, i = +el.dataset.i; let n = null;
      if (e.key === 'Enter' || e.key === 'ArrowDown') { n = document.getElementById(`fg_${ti}_${i + 1}`) || (ti + 1 < nt ? document.getElementById(`fg_${ti + 1}_0`) : null) }
      else if (e.key === 'ArrowUp') n = document.getElementById(`fg_${ti}_${i - 1}`); else return;
      e.preventDefault(); if (n) { n.focus(); n.select() }
    }
    function fgPaste(e, fi, ti, i) {
      const tx = (e.clipboardData || window.clipboardData).getData('text'); if (!/[\t\n]/.test(tx.trim())) return;
      e.preventDefault(); const f = db.files[fi];
      tx.replace(/\r/g, '').replace(/\n+$/, '').split('\n').forEach((ln, r) => ln.split('\t').forEach((v, c) => {
        const t = f.tek[ti + c]; if (!t || i + r >= f.mat.length) return;
        if (!t.kalemler) t.kalemler = []; while (t.kalemler.length < f.mat.length) t.kalemler.push('');
        t.kalemler[i + r] = v.replace(/[^\d.,]/g, '');

    /* ================= FİRMALAR (ana kayıt) ================= */
    let frmQ = '', frmForm = null, frmMsg = '';

    function frmMatch(x, q) { const h = trl(x.no + ' ' + x.unvan + ' ' + x.ilet + ' ' + x.yer); return trl(q).split(/\s+/).filter(Boolean).every(w => h.includes(w)) }
    function frmUpsert(no, unvan, ilet, yer) {

        : `<div class="mu">${db.firmalar.length ? 'Eşleşen kayıtlı firma yok — yazdığınız ünvan yeni firma olarak kaydedilir.' : 'Kayıtlı firma yok. 🏭 Firmalar sekmesinden HTML aktarın veya yazarak ekleyin.'}</div>`;

    function tekFirmaSel(fid) {
      const x = db.firmalar.find(z => z.id == fid); if (!x) return; const S = (i, v) => { const e = document.getElementById(i); if (e) e.value = v };

    /* Kazanan Firma / Sözleşme sekmesi: kayıtlı firmadan ekle */
    function winPickHTML() {
      return `<div class="card"><h2>🏭 Kayıtlı firmalardan ekle</h2><div class="lbl" style="max-width:520px">Firma ara ve seç (kazanan firma listesine eklenir)${fcbHTML('wp_firma', '', 'Firma No / ünvan / şehir ara…', 'winAdd')}</div></div>`;

    }
    function frmList() { document.getElementById('frt').innerHTML = frmTable() }
    function frmHTML() {
      const fm = frmForm ? (frmForm.id ? db.firmalar.find(x => x.id == frmForm.id) : null) : null;

    function frmCSV() {
      const q = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
      dl('firmalar.csv', '\ufeff' + [['Firma No', 'Firma Ünvanı', 'Telefon/Faks/Email', 'Semt Şehir'].map(q).join(';')].concat(db.firmalar.map(x => [x.no, x.unvan, x.ilet, x.yer].map(q).join(';'))).join('\r\n'), 'text/csv');
    }
    /* HTML tablosunu ayrıştır ve firmaları aktar */
    function frmParse(txt) {
      if (!/<table/i.test(txt)) txt = '<table>' + txt + '</table>';
      const doc = new DOMParser().parseFromString(txt, 'text/html'), out = [];
      const ct = c => { const cl = c.cloneNode(true); cl.querySelectorAll('br').forEach(b => b.replaceWith('\n')); cl.querySelectorAll('script,style').forEach(e => e.remove()); return cl.textContent.split(/\n/).map(x => x.replace(/\s+/g, ' ').trim()).filter(Boolean).join(' · ') };
      doc.querySelectorAll('table').forEach(tb => {
        const rows = [...tb.rows]; if (!rows.length) return;
        let hi = rows.findIndex(r => r.parentElement.tagName === 'THEAD' || (r.querySelector('th') && !r.querySelector('td')));
        let m = { no: 0, unvan: 1, ilet: 2, yer: 3 };
        if (hi >= 0) {
          const hs = [...rows[hi].cells].map(c => trl(ct(c)));
          const fi = re => hs.findIndex(h => re.test(h));
          const u = fi(/ünvan|unvan|firma ad|^firma$/), n = fi(/firma no|^no$|kod/), i = fi(/telefon|faks|e-?mail|e-?posta|iletişim/), y = fi(/semt|şehir|sehir|adres/);
          if (u >= 0) m = { no: n, unvan: u, ilet: i, yer: y }; else if (hs.length < 2) return;
        }
        rows.forEach((r, ri) => {
          if (ri === hi || (r.querySelector('th') && !r.querySelector('td'))) return;
          const c = [...r.cells]; if (c.length < 2) return;
          const g = k => m[k] >= 0 && c[m[k]] ? ct(c[m[k]]) : '';
          const x = { no: g('no'), unvan: g('unvan'), ilet: g('ilet'), yer: g('yer') };
          if (x.unvan) out.push(x);
        });
      });
      return out;
    }
    function frmImport(txt, upd) {
      const L = frmParse(txt); let a = 0, u = 0, k = 0;
      L.forEach(x => {
        const ex = db.firmalar.find(z => (x.no && z.no && z.no === x.no) || trl(z.unvan) === trl(x.unvan));
        if (!ex) { db.firmalar.push({ id: uid(), no: x.no, unvan: x.unvan, ilet: x.ilet, yer: x.yer }); a++ }
        else if (upd) { ex.no = x.no || ex.no; ex.unvan = x.unvan; ex.ilet = x.ilet || ex.ilet; ex.yer = x.yer || ex.yer; u++ }
        else k++;
      });
      return { add: a, upd: u, skip: k, msg: L.length ? `${L.length} satır okundu: ${a} yeni firma eklendi, ${u} güncellendi, ${k} atlandı.` : 'HTML içinde firma satırı bulunamadı (sütun başlıkları: Firma No, Firma Ünvanı, Telefon/Faks/Email, Semt Şehir).' };
    }


    /* ================= MALZEME KATALOĞU + MALZEME EKLE ================= */

    const BIRIMLER = ['Adet', 'Kg', 'Gram', 'Ton', 'Lt', 'Metre', 'M²', 'M³', 'Paket', 'Kutu', 'Koli', 'Takım', 'Rulo', 'Torba', 'Çift', 'Set'];
    function katMatch(x, q) { const h = trl(x.kod + ' ' + x.tasinir + ' ' + x.okas + ' ' + x.ad); return trl(q).split(/\s+/).filter(Boolean).every(w => h.includes(w)) }
    function katSub(x) { return [x.kod && 'Kod: ' + x.kod, x.tasinir && 'Taşınır: ' + x.tasinir, x.okas && 'OKAS: ' + x.okas].filter(Boolean).join(' · ') }
    function katFind(x) { return db.katalog.find(z => (x.kod && z.kod && z.kod === x.kod) || (!x.kod && trl(z.ad) === trl(x.ad)) || (!z.kod && trl(z.ad) === trl(x.ad))) }

        : `<div class="mu">${db.katalog.length ? 'Katalogda eşleşme yok — yazdığınız adla elle ekleyebilirsiniz.' : 'Katalog boş. 📚 Malzeme Kataloğu sekmesinden HTML aktarın veya elle yazın.'}</div>`;
      l.classList.remove('hide');
    }

    /* Malzeme listesine HTML tablosundan toplu aktarım */
    function matFile(i) { const r = new FileReader(); r.onload = () => document.getElementById('mtTa').value = r.result; if (i.files[0]) r.readAsText(i.files[0]) }
    function matParse(txt) {

      const doc = new DOMParser().parseFromString(txt, 'text/html'), out = [];
      const ct = c => { const k = c.cloneNode(true); k.querySelectorAll('script,style').forEach(e => e.remove()); return k.textContent.replace(/\s+/g, ' ').trim() };
      doc.querySelectorAll('table').forEach(tb => {
        const rows = [...tb.rows]; if (!rows.length) return;
        const hi = rows.findIndex(r => r.parentElement.tagName === 'THEAD' || (r.querySelector('th') && !r.querySelector('td')));

        if (hi >= 0) {
          const hs = [...rows[hi].cells].map(c => trl(ct(c))), fi = re => hs.findIndex(h => re.test(h));
          const a = fi(/malzeme ad|^ad$|^adı$/);
          if (a >= 0) m = { kod: fi(/malzeme kod|^kod$/), ad: a, ozel: fi(/özelli|ozelli/), birim: fi(/^birim(i)?$/), kdv: fi(/kdv/), mik: fi(/miktar/) };

          const c = [...r.cells]; if (c.length < 3) return;
          const g = k => m[k] >= 0 && c[m[k]] ? ct(c[m[k]]) : '';
          const x = { kod: g('kod'), ad: g('ad'), ozel: g('ozel'), birim: g('birim'), kdv: g('kdv').replace(/^%\s*/, ''), mik: g('mik') };

    /* ================= KABUL TUTANAKLARI ================= */

    const kbTxt = c => { const k = c.cloneNode(true); k.querySelectorAll('script,style').forEach(e => e.remove()); return k.textContent.replace(/\s+/g, ' ').trim() };
    function kbDate(v) { const m = String(v || '').match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/); return m ? m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0') : String(v || '') }
    function kbFirmalar(f) {

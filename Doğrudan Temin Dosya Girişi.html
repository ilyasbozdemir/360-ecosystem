        <div class="bar"><button onclick="document.getElementById('kfImp').classList.toggle('hide')">📥 HTML ile Firma Aktar</button></div>

          <textarea id="kfTa" rows="6" style="width:100%" placeholder="<thead>…</thead><tbody>…</tbody>"></textarea>

    function kbFile(i, id) { const r = new FileReader(); r.onload = () => document.getElementById(id).value = r.result; if (i.files[0]) r.readAsText(i.files[0]) }
    function kbRows(txt) {
      if (!/<table/i.test(txt)) txt = '<table>' + txt + '</table>';
      const doc = new DOMParser().parseFromString(txt, 'text/html'), out = [];
      doc.querySelectorAll('table').forEach(tb => {
        const rows = [...tb.rows], hi = rows.findIndex(r => r.parentElement.tagName === 'THEAD' || (r.querySelector('th') && !r.querySelector('td')));
        out.push({ hs: hi >= 0 ? [...rows[hi].cells].map(c => trl(kbTxt(c))) : null, rows: rows.filter((r, i) => i !== hi && r.querySelector('td')).map(r => [...r.cells].map(c => kbTxt(c))) });

    function kbFirmImport() {

    function kbMalAdd(i) {

      const rows = f.kab.map((k, i) => `<tr style="${i == kabI ? 'background:var(--ac2)' : ''}">${KB_COLS.map(n => `<td style="padding:0"><input ${n === 'Kabul Tarihi' ? 'type="date"' : ''} value="${esc(k.h[n])}" oninput="kbSet(${i},'${n}',this.value)" style="width:100%;min-width:${n === 'Firma' ? 260 : 120}px;background:transparent;border:1px solid var(--br);border-radius:0"></td>`).join('')}<td style="white-space:nowrap"><button class="s" onclick="kabI=${i};draw()">Aç</button> <button class="s" title="Bu tutanağın bağlantısını kopyala" onclick="kbCopyLink(${i})">🔗</button> <button class="s del" onclick="kbDel(${i})">🗑 Sil</button></td></tr>`).join('');
      return `<div class="card"><h2>✅ Kabul Tutanakları (${f.kab.length})</h2>
        <div class="bar" style="margin:0 0 8px"><button class="p" onclick="addK()">+ Tutanak</button><button onclick="document.getElementById('kbImp').classList.toggle('hide')">📥 HTML ile Aktar</button></div>
        <div id="kbImp" class="hide card" style="background:var(--ac2)"><b>Kabul tutanakları tablosundan aktarım</b>
          <p class="mu">Tablonun HTML’ini yapıştırın (<code>&lt;thead&gt;…&lt;tbody&gt;</code>). Sütunlar: Kabul Tarihi · Firma · Sayı · Teslim Alan · Teslim Yeri · İşlem (İşlem yok sayılır). 01.02.2026 gibi tarihler otomatik çevrilir.</p>

    }
    function kbSet(i, n, v) { const k = cur().kab[i]; if (k) { k.h[n] = v; save() } }

    function kbImport() {
      const t = document.getElementById('kbTa').value; if (!t.trim()) return alert('Önce HTML yapıştırın veya dosya seçin.');
      const f = cur(), fill = document.getElementById('kbMat').checked; let a = 0;
      kbRows(t).forEach(tb => {
        let m = [0, 1, 2, 3, 4];

      let tk = 0, tt = 0;
      const matRows = f.mat.map((m, i) => { const q = num(m[6]), p = num(m[7]), tm = teslim(m); tk += q * p; tt += q * p * (1 + num(m[5]) / 100); const pc = q ? Math.min(100, Math.round(tm / q * 100)) : 0; return `<tr><td class="n">${i + 1}</td><td>${esc(m[1])}</td><td class="wr"><b>${esc(m[2])}</b><div class="mu">${esc(m[3])}</div></td><td>${esc(m[4])}</td><td style="text-align:right">${esc(m[6])}</td><td style="text-align:right">${p ? money(p) : '—'}</td><td class="wr mu">${esc(m[8] || '')}</td><td style="text-align:right">${esc(m[5] ? '%' + m[5] : '')}</td><td style="text-align:right;font-weight:600">${p ? money(q * p) : '—'}</td><td style="text-align:right">${tm || (f.kab.length ? '0' : '—')}${q && f.kab.length ? ` <span class="mu">(%${pc})</span>` : ''}</td></tr>` }).join('');
      const winRows = win.map(w => { const c = con.find(x => trl(x[0]) === trl(w[1])), t = T.find(x => trl(x.firma) === trl(w[1])); return `<tr><td>${esc(w[0])}</td><td class="wr"><b>${esc(w[1])}</b></td><td class="wr">${esc(w[2])}<div class="mu">${esc(w[3])}</div></td><td style="text-align:right">${t && tekTutar(t, f) ? money(tekTutar(t, f)) : '—'}</td><td class="wr">${esc(c ? c[1] : '') || '<span class="mu">—</span>'}</td></tr>` }).join('');
      const kabRows = f.kab.map((k, i) => `<tr><td>${fmt(k.h['Kabul Tarihi'])}</td><td class="wr"><b>${esc(k.h['Firma'])}</b></td><td>${esc(k.h['Sayı'])}</td><td>${esc(k.h['Teslim Alan'])}</td><td class="wr">${esc(k.h['Teslim Yeri'])}</td><td>${fmt(k.h['Fatura Tarihi'])}<div class="mu">${esc(k.h['Fatura No'] ? 'No: ' + k.h['Fatura No'] : '')}</div></td><td style="text-align:right">${k.m.length}</td><td class="wr">${esc(k.h['Not'])}</td><td><button class="s" onclick="db.cur=${fi};kabI=${i};tab='kab';draw()">Aç</button></td></tr>`).join('');
      const kom = (arr, ttl) => `<div style="flex:1;min-width:280px"><b>${ttl}</b>${arr.length ? `<table style="margin-top:4px"><tr><th>Görevi</th><th>Adı Soyadı</th><th>Unvanı</th></tr>${arr.map(r => `<tr><td>${esc(r[1])}</td><td><b>${esc(r[2])}</b></td><td>${esc(r[3])}</td></tr>`).join('')}</table>` : '<p class="mu">Kayıt yok.</p>'}</div>`;
      const ekRows = (f.ek || []).map(e => `<tr><td class="wr">${esc(e.ad)}</td><td>${esc(e.kat || '')}</td><td>${fmt(e.tarih)}</td><td>${e.boyut ? fsize(e.boyut) : ''}</td><td class="wr">${esc(e.not || '')}</td></tr>`).join('');

      return `<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start"><div><h2 style="margin:0;border:none;padding:0">📊 Dosya Özeti</h2><div style="font-size:15px;font-weight:700;margin-top:4px">${esc(g('Dosya No') || '—')} · ${esc(g('İşin Adı / Tanımı') || 'İş adı girilmemiş')}</div>${g('Açıklama') ? `<div class="mu" style="margin-top:2px">${esc(g('Açıklama'))}</div>` : ''}</div><div class="bar" style="margin:0"><button class="s" onclick="copyPageLink()">🔗 Bağlantı</button><button class="s" onclick="print()">🖨 Yazdır</button></div></div>
        <div class="kpi" style="margin-top:10px">${bd('İlerleme: %' + pct)}${bd(f.mat.length + ' kalem')}${bd('Teklif istenen: ' + T.length)}${bd('Gelen: ' + gel.length)}${bd('Tutanak: ' + f.kab.length)}${bd('Ek: ' + (f.ek || []).length)}${tut ? bd('Tutar (KDV hariç): ' + money(tut), '#10b98133') : ''}${tutKdv ? bd('KDV dahil: ' + money(tutKdv), '#10b98133') : ''}</div>
        <div style="height:8px;background:var(--br);border-radius:6px;overflow:hidden;margin:4px 0 10px"><div style="height:100%;width:${pct}%;background:var(--ac)"></div></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">${stages}</div>
        <p class="mu" style="margin-top:8px">Fiyat esası: <b>${basis}</b>${min ? ` · En düşük teklif: <b>${esc(min.t.firma)}</b> (${money(min.tu)})` : ''}</p></div>
      ${H('📝 Dosya Bilgileri', go2('f'))}<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 16px">${bilgi}</div></div>
      ${H('🕒 Neler Olmuş? (olay akışı)')}${timeline}</div>
      ${H('💬 Firmalar ve Teklifler', go2('tek'))}${T.length ? wrap(`<tr><th>Firma</th><th>İletişim</th><th>İstek</th><th>Durum</th><th>Teklif Tarihi</th><th>Tutar (KDV hariç)</th><th>Fark</th><th>Geçerlilik</th><th>Not</th></tr>${tekRows}`, 1000) : '<p class="mu">Teklif istenen firma yok.</p>'}</div>
      ${H('📦 Malzemeler, Fiyatlar ve Teslimat', go2('mat'))}${f.mat.length ? wrap(`<tr><th>#</th><th>Kod</th><th>Malzeme</th><th>Birim</th><th>Miktar</th><th>Birim Fiyat</th><th>Fiyat Kaynağı</th><th>KDV</th><th>Tutar (KDV hariç)</th><th>Teslim Alınan</th></tr>${matRows}<tr style="font-weight:700"><td></td><td></td><td>TOPLAM</td><td></td><td></td><td></td><td></td><td></td><td style="text-align:right">${money(tk)}</td><td></td></tr><tr style="font-weight:700"><td></td><td></td><td>KDV DAHİL TOPLAM</td><td></td><td></td><td></td><td></td><td></td><td style="text-align:right">${money(tt)}</td><td></td></tr>`, 1000) : '<p class="mu">Malzeme eklenmemiş.</p>'}</div>
      ${H('🏢 Kazanan Firma ve Sözleşme', go2('win'))}${win.length ? wrap(`<tr><th>No</th><th>Firma</th><th>İletişim / Yer</th><th>Teklif Tutarı</th><th>Sözleşme</th></tr>${winRows}`, 760) : '<p class="mu">Kazanan firma belirlenmemiş.</p>'}</div>
      ${H('✅ Kabul Tutanakları', go2('kab'))}${f.kab.length ? wrap(`<tr><th>Kabul Tarihi</th><th>Firma</th><th>Sayı</th><th>Teslim Alan</th><th>Teslim Yeri</th><th>Fatura</th><th>Kalem</th><th>Not</th><th></th></tr>${kabRows}`, 900) : '<p class="mu">Kabul tutanağı yok.</p>'}</div>
      ${H('👥 Komisyonlar', go2('kom'))}<div style="display:flex;gap:16px;flex-wrap:wrap">${kom(f.yak || [], T_yak())}${kom(f.muay || [], T_muay())}</div></div>
      ${H('📎 Ek Dosyalar', go2('ek'))}${ekRows ? wrap(`<tr><th>Dosya</th><th>Tür</th><th>Tarih</th><th>Boyut</th><th>Not</th></tr>${ekRows}`, 640) : '<p class="mu">Ek dosya yok.</p>'}</div>`;
    }
    const T_yak = () => T.yak[0], T_muay = () => T.muay[0];

    /* Katalog sekmesi */
    function katRows() { return db.katalog.filter(x => !katQ || katMatch(x, katQ)) }
    function katTable() {
      const R = katRows(), sh = R.slice(0, 300);
      return `<table class="wide" style="min-width:820px"><thead><tr class="success"><th>Malzeme Kodu</th><th>Taşınır Kodu</th><th>OKAS Kodu</th><th>Malzeme Adı</th><th>İşlem</th></tr></thead><tbody>${sh.map(x => `<tr><td>${esc(x.kod)}</td><td>${esc(x.tasinir)}</td><td>${esc(x.okas)}</td><td class="wr"><b>${esc(x.ad)}</b></td><td style="white-space:nowrap"><button class="s p" onclick="matFromKat('${x.id}')" title="Açık dosyanın malzeme listesine ekle">➕ Listeye ekle</button> <button class="s" onclick="katEdit('${x.id}')">Düzenle</button> <button class="s del" onclick="katDel('${x.id}')">🗑 Sil</button></td></tr>`).join('')}</tbody></table>` +
        (R.length ? `<p class="mu" style="padding:6px 8px">${R.length} malzeme${R.length > sh.length ? ' · ilk ' + sh.length + ' gösteriliyor, aramayla daraltın' : ''}</p>` : '<p class="mu" style="padding:8px">Kayıt bulunamadı.</p>');
    }
    function katList() { document.getElementById('kat_t').innerHTML = katTable() }
    function katHTML() {
      const km = katForm && katForm.id ? db.katalog.find(x => x.id == katForm.id) : null;
      const form = katForm ? `<div class="card formcard"><h2>${katForm.id ? '✏ Malzemeyi Güncelle' : '➕ Yeni Malzeme'}</h2><div class="grid">
        <label>Malzeme Kodu<input id="km_kod" value="${esc(km ? km.kod : '')}"></label><label>Taşınır Kodu<input id="km_tas" value="${esc(km ? km.tasinir : '')}"></label>
        <label>OKAS Kodu<input id="km_okas" value="${esc(km ? km.okas : '')}"></label><label>Malzeme Adı *<input id="km_ad" value="${esc(km ? km.ad : '')}"></label></div>
        <div class="bar"><button class="p" onclick="katSave()">Kaydet</button><button onclick="katForm=null;draw()">İptal</button></div></div>` : '';
      return form + `<div class="card"><h2>📚 Malzeme Kataloğu (${db.katalog.length})</h2>
        <div class="bar" style="margin:0 0 10px"><input placeholder="Ara: malzeme kodu, taşınır, OKAS, ad..." value="${esc(katQ)}" oninput="katQ=this.value;katList()" style="flex:1;min-width:200px">
          <button class="p" onclick="katForm={id:null};draw()">+ Yeni Malzeme</button><button onclick="document.getElementById('katImp').classList.toggle('hide')">📥 HTML ile Aktar</button>
          <button onclick="katCSV()">Excel (CSV)</button><button class="del" onclick="katClear()">🗑 Tümünü Sil</button></div>
        <div id="katImp" class="hide card" style="background:var(--ac2)"><b>HTML ile toplu malzeme aktarımı</b>
          <p class="mu">Tablonun HTML’ini yapıştırın (<code>&lt;table&gt;</code> ya da sadece <code>&lt;thead&gt;…&lt;tbody&gt;</code>) veya .html dosyası seçin. Sütunlar: Malzeme Kodu · Taşınır Kodu · OKAS Kodu · Malzeme Adı (İşlem sütunu yok sayılır). Tüm satırlar aktarılır.</p>
          <textarea id="katTa" rows="7" style="width:100%" placeholder="<thead>…</thead><tbody>…</tbody>"></textarea>
          <div class="bar"><input type="file" accept=".html,.htm,.txt" onchange="katFile(this)"><label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="katUpd" checked style="width:auto"> Aynı kayıt varsa güncelle</label><button class="p" onclick="katImpClick()">İçe Aktar</button></div></div>
        ${katMsg ? `<p class="badge" style="background:#10b98122;color:#059669;font-size:12.5px">${esc(katMsg)}</p>` : ''}
        <div class="sc" id="kat_t">${katTable()}</div></div>`;
    }
    function katFile(i) { const r = new FileReader(); r.onload = () => document.getElementById('katTa').value = r.result; if (i.files[0]) r.readAsText(i.files[0]) }
    function katImpClick() { const t = document.getElementById('katTa').value; if (!t.trim()) return alert('Önce HTML yapıştırın veya dosya seçin.'); katMsg = katImport(t, document.getElementById('katUpd').checked).msg; save(); draw() }
    function katEdit(id) { katForm = { id }; draw(); window.scrollTo(0, 0) }
    function katSave() {
      const g = i => document.getElementById(i).value.trim(), ad = g('km_ad'); if (!ad) return alert('Malzeme adı zorunludur.');
      if (katForm.id) { const x = db.katalog.find(z => z.id == katForm.id); if (x) { x.kod = g('km_kod'); x.tasinir = g('km_tas'); x.okas = g('km_okas'); x.ad = ad } }
      else db.katalog.push({ id: uid(), kod: g('km_kod'), tasinir: g('km_tas'), okas: g('km_okas'), ad });
      katForm = null; save(); draw();
    }
    function katDel(id) { const x = db.katalog.find(z => z.id == id); if (!x || !confirm('“' + x.ad + '” katalogdan silinsin mi? (Dosyalardaki malzemeler korunur.)')) return; db.katalog = db.katalog.filter(z => z.id != id); save(); draw() }
    function katClear() { if (!db.katalog.length) return; if (!confirm(db.katalog.length + ' malzemenin tamamı katalogdan silinsin mi? (Dosyalardaki malzemeler korunur.)')) return; db.katalog = []; save(); draw() }
    function matFromKat(id) {
      const x = db.katalog.find(z => z.id == id), f = cur(); if (!x || !f) return;
      f.mat.push(['', x.kod, x.ad, '', mtLast.birim, mtLast.kdv, '1', '', '', x.tasinir, x.okas]);
      katMsg = '“' + x.ad + '” → ' + (f.f['Dosya No'] || 'açık dosya') + ' malzeme listesine eklendi (' + f.mat.length + ' kalem).'; save(); draw();
    }
    function katCSV() {
      const q = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
      dl('malzeme_katalogu.csv', '\ufeff' + [['Malzeme Kodu', 'Taşınır Kodu', 'OKAS Kodu', 'Malzeme Adı'].map(q).join(';')].concat(db.katalog.map(x => [x.kod, x.tasinir, x.okas, x.ad].map(q).join(';'))).join('\r\n'), 'text/csv');
    }
    function katParse(txt) {
      if (!/<table/i.test(txt)) txt = '<table>' + txt + '</table>';
      const doc = new DOMParser().parseFromString(txt, 'text/html'), out = [];
      const ct = c => { const k = c.cloneNode(true); k.querySelectorAll('script,style').forEach(e => e.remove()); return k.textContent.replace(/\s+/g, ' ').trim() };
      doc.querySelectorAll('table').forEach(tb => {
        const rows = [...tb.rows]; if (!rows.length) return;
        const hi = rows.findIndex(r => r.parentElement.tagName === 'THEAD' || (r.querySelector('th') && !r.querySelector('td')));
        let m = { kod: 0, tasinir: 1, okas: 2, ad: 3 };
        if (hi >= 0) {
          const hs = [...rows[hi].cells].map(c => trl(ct(c))), fi = re => hs.findIndex(h => re.test(h));
          const a = fi(/malzeme ad|^ad$|^adı$|tanım/);
          if (a >= 0) m = { kod: fi(/malzeme kod|^kod$/), tasinir: fi(/taşınır|tasinir|taşinir/), okas: fi(/okas/), ad: a };
        }
        rows.forEach((r, ri) => {
          if (ri === hi || (r.querySelector('th') && !r.querySelector('td'))) return;
          const c = [...r.cells]; if (c.length < 2) return;
          const g = k => m[k] >= 0 && c[m[k]] ? ct(c[m[k]]) : '';
          const x = { kod: g('kod'), tasinir: g('tasinir'), okas: g('okas'), ad: g('ad') };
          if (x.ad) out.push(x);
        });
      });
      return out;
    }
    function katImport(txt, upd) {
      const L = katParse(txt); let a = 0, u = 0, k = 0;
      L.forEach(x => {
        const ex = katFind(x);
        if (!ex) { db.katalog.push({ id: uid(), kod: x.kod, tasinir: x.tasinir, okas: x.okas, ad: x.ad }); a++ }
        else if (upd) { ex.kod = x.kod || ex.kod; ex.tasinir = x.tasinir || ex.tasinir; ex.okas = x.okas || ex.okas; ex.ad = x.ad; u++ }
        else k++;
      });
      return { add: a, upd: u, skip: k, msg: L.length ? `${L.length} satır okundu: ${a} yeni malzeme eklendi, ${u} güncellendi, ${k} atlandı.` : 'HTML içinde malzeme satırı bulunamadı (sütun başlıkları: Malzeme Kodu, Taşınır Kodu, OKAS Kodu, Malzeme Adı).' };
    }

    /* ---- Ek Dosyalar (IndexedDB 'a' deposunda saklanır) ---- */
    const EK_KAT = ["Şartname", "Teklif", "Sözleşme", "Fatura", "Kabul Tutanağı", "Yazışma", "Fiyat Araştırması", "Diğer"];
    async function idbAPut(k, v) { const d = await idb(); return new Promise((res, rej) => { const t = d.transaction('a', 'readwrite'); t.objectStore('a').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error) }) }
    async function idbAGet(k) { const d = await idb(); return new Promise(res => { const r = d.transaction('a').objectStore('a').get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(null) }) }
    async function idbDel(k) { try { const d = await idb(); return new Promise(res => { const t = d.transaction('a', 'readwrite'); t.objectStore('a').delete(k); t.oncomplete = res; t.onerror = res }) } catch (e) { } }
    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8) }
    const fsize = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB';
    const ekIcon = t => /pdf/.test(t) ? '📕' : /image/.test(t) ? '🖼' : /sheet|excel|csv/.test(t) ? '📊' : /word|document/.test(t) ? '📘' : /zip|rar|7z/.test(t) ? '🗜' : '📄';

    function ekHTML(f) {
      const rows = (f.ek || []).map((e, i) => `<tr>
        <td class="n">${i + 1}</td><td class="ek-ic">${ekIcon(e.tur)}</td>
        <td><b>${esc(e.ad)}</b><div class="mu">${fsize(e.boyut)} · ${fmt(e.tarih)}</div></td>
        <td style="min-width:140px"><select onchange="ekSet('${e.id}','kat',this.value)">${EK_KAT.map(k => `<option ${e.kat == k ? 'selected' : ''}>${k}</option>`).join('')}</select></td>
        <td style="min-width:180px"><input value="${esc(e.not)}" placeholder="Not / açıklama" oninput="ekSet('${e.id}','not',this.value)"></td>
        <td style="white-space:nowrap"><button class="s" onclick="ekOpen('${e.id}')">Aç</button> <button class="s" onclick="ekDl('${e.id}')">İndir</button> <button class="s" onclick="ekDel('${e.id}')">×</button></td></tr>`).join('');
      return `<div class="card"><h2>📎 Ek Dosyalar</h2>
        <div class="drop" id="drop" onclick="document.getElementById('ekin').click()">
          <div style="font-size:26px">📎</div><b>Dosyaları buraya sürükleyin</b> veya tıklayıp seçin
          <div class="mu">PDF, Word, Excel, resim, ZIP… birden fazla dosya seçebilirsiniz. Dosyalar bu tarayıcıda saklanır.</div>
        </div>
        <input type="file" id="ekin" multiple class="hide" onchange="ekAdd(this.files);this.value=''">
        <div class="bar"><label style="flex-direction:row;align-items:center;gap:6px">Yüklenecekler için tür:
          <select id="ekkat" style="width:auto">${EK_KAT.map(k => `<option>${k}</option>`).join('')}</select></label></div>
        ${(f.ek || []).length ? `<div class="sc"><table style="min-width:720px"><tr><th>#</th><th></th><th>Dosya</th><th>Tür</th><th>Not</th><th></th></tr>${rows}</table></div>` : '<p class="mu">Bu dosyaya henüz ek yüklenmedi.</p>'}
      </div>`;
    }
    function ekBind() {
      const d = document.getElementById('drop'); if (!d) return;
      ['dragenter', 'dragover'].forEach(ev => d.addEventListener(ev, e => { e.preventDefault(); d.classList.add('over') }));
      ['dragleave', 'drop'].forEach(ev => d.addEventListener(ev, e => { e.preventDefault(); d.classList.remove('over') }));
      d.addEventListener('drop', e => ekAdd(e.dataTransfer.files));
    }
    async function ekAdd(files) {
      const f = cur(); if (!f.ek) f.ek = []; const kat = (document.getElementById('ekkat') || {}).value || 'Diğer'; let n = 0;
      for (const fl of files) {
        const id = uid();
        try { await idbAPut(id, fl); f.ek.push({ id, ad: fl.name, tur: fl.type || '', boyut: fl.size, kat, not: '', tarih: new Date().toISOString().slice(0, 10) }); n++ }
        catch (e) { alert('"' + fl.name + '" tarayıcıya kaydedilemedi (depolama dolu olabilir).') }
      }
      save(); st.textContent = n + ' dosya eklendi'; draw();
    }
    function ekSet(id, k, v) { const e = cur().ek.find(x => x.id == id); if (e) { e[k] = v; save() } }
    async function ekBlobUrl(id) { const b = await idbAGet(id); return b ? URL.createObjectURL(b) : null }
    async function ekOpen(id) { const u = await ekBlobUrl(id); if (!u) return alert('Dosya bulunamadı (başka tarayıcıdan aktarılmış olabilir).'); window.open(u, '_blank') }

        if (k === '#' || k === '^') { const nd = { k: k, n: n, c: [] }; P(nd); st.push(nd) }

        else if (k === '' && /^else/.test(n)) { if (st.length > 1) { const top = st[st.length - 1], nd = top.o || top; nd.br = nd.br || [{ cd: nd.n.replace(/^if\s+/, ''), c: nd.c }]; const b = { cd: /^else\s+if\s+/.test(n) ? n.replace(/^else\s+if\s+/, '') : null, c: [], o: nd }; nd.br.push(b); st[st.length - 1] = b } }

      const p = n.split('.'); for (let i = fr.length - 1; i >= 0; i--) { let d = fr[i].d; if (d && typeof d === 'object' && p[0] in d) { for (const k of p) { if (d == null) break; d = d[k] } return d } }
    }
    const ok = v => Array.isArray(v) ? v.length > 0 : !!v;

    function getMergedCatalog() {
      const cat = JSON.parse(JSON.stringify(TPL_CATALOG));
      const known = new Set();
      cat.forEach(g => g.items.forEach(it => known.add(g.key + '/' + it)));

      const extra = [];
      Object.keys(TPL).forEach(k => {
        if (!known.has(k)) {
          const p = k.split('/');
          const parent = cat.find(g => g.key === p[0]);
          if (parent && p.length > 1) {
            if (!parent.items.includes(p[1])) parent.items.push(p[1]);
          } else {
            extra.push(k);
          }
        }
      });
      if (extra.length) {
        cat.push({ key: "ozel", title: "Özel Yüklenen Şablonlar", items: extra });
      }
      return cat;
    }

    function updateSidebarTpl() {
      const wrap = document.getElementById("sbTplTree");
      const badge = document.getElementById("sbTplBadge");
      if (!wrap) return;

      const catalog = getMergedCatalog();
      let totalCount = 0;
      catalog.forEach(g => totalCount += g.items.length);
      if (badge) badge.textContent = totalCount;

      const q = tplFilterText;
      let html = '';

      catalog.forEach((group, gIdx) => {
        const matchingItems = group.items.filter(id => {
          if (!q) return true;
          const title = (TPL_NAMES[id] || id).toLowerCase();
          const code = id.toLowerCase();
          const cat = group.title.toLowerCase();
          return title.includes(q) || code.includes(q) || cat.includes(q);
        });

        if (!matchingItems.length && q) return;

        const itemsHtml = matchingItems.map(id => {
          const fullKey = group.key === 'ozel' ? id : (group.key + '/' + id);
          const isCustom = !!(TPL[fullKey] || TPL[id]);
          const isActive = (tab === 'sab' && (currentTplKey === fullKey || currentTplKey === id));
          const title = TPL_NAMES[id] || id.replace(/^[0-9]+-/, '').replace(/-/g, ' ');
          const customTag = isCustom ? `<span class="tag">Özel</span>` : '';
          return `<button class="tpl-item ${isActive ? 'active' : ''}" onclick="openTpl('${esc(fullKey)}')" title="${esc(title)}">

        <span style="flex:1;overflow:hidden;text-overflow:ellipsis">${esc(title)}</span>
        ${customTag}
      </button>`;

      <div class="tpl-group">
        <div class="tpl-group-title" onclick="this.nextElementSibling.classList.toggle('hide')">

    /* ---- Veri eşleme (Dosyaya özel şablon verisi öncelikli) ---- */
    function sCtx(f, tj, useT) {
      const k = db.kurum || {}, fs = f.sablon || {}, x = f.f, o = {};
      const S = (a, v) => { if (v) o[a] = v };
      const dd = v => v ? v.slice(0, 10).split('-').reverse().join('.') : '';

      ['dosyaKonusu', 'isAdi', 'isinAdi'].forEach(a => S(a, x['İşin Adı / Tanımı']));
      S('dosyaTarihi', dd(x['Dosya Açılış Tarihi'])); S('tarih', dd(x['Dosya Açılış Tarihi']));
      S('dosyaNumarasi', x['Dosya No']); S('teminNo', x['Doğrudan Temin Numarası']); S('yili', x['Bütçe Yılı']);
      ['birimAdi', 'mudurluk'].forEach(a => S(a, x['İhalesi Yapılacak Birim'])); S('sunulacakMakamAdi', x['Sunulacak Makam']);
      S('alimTuru', x['Alım Türü']); S('aciklama', x['Açıklama']); S('isinAciklamasi', x['Açıklama']);
      S('yukleniciFirma', (f.win[0] || [])[1]);

      // Dosyaya özel şablon alanları öncelikli, boşsa ortak kurumdan al
      const kfKeys = ['evrakSayisi', 'baskanAdi', 'baskanUnvan', 'hazirlayanPersonelAdi', 'hazirlayanPersonelUnvan', 'onaylayanPersonelAdi', 'onaylayanPersonelUnvan'];
      kfKeys.forEach(a => {
        const v = fs[a] || k[a];
        if (v) o[a] = v;
      });

      // Malzemeler (Birim Fiyat ve Toplam Tutar ekli)
      if (f.mat.length) {
        o.ihtiyacKalemleri = f.mat.map((r, i) => {
          const miktar = parseFloat(r[6]) || 0;
          const birimFiyat = parseFloat(r[7]) || 0;
          const toplamFiyat = (miktar && birimFiyat) ? (miktar * birimFiyat).toFixed(2) : '';
          return {
            siraNo: i + 1,
            kodu: r[1] || '',
            malzemeAdi: r[2] || '',
            ozelligi: r[3] || '',
            birimi: r[4] || '',
            kdvOrani: r[5] || '20',
            miktar: r[6] || '1',
            birimFiyat: r[7] || '',
            toplamFiyat: toplamFiyat,
            tutar: toplamFiyat
          };
        });
        o.kalemSayisi = f.mat.length;
      }

      // Komisyonlar (Ad Soyad, Görevi, Unvanı)
      const km = r => ({ adSoyad: r[2] || '', gorevi: r[1] || '', unvan: r[3] || '' });
      if (f.yak.length) { o.yaklasikMaliyetKomisyonu = f.yak.map(km); o.komisyon = o.yaklasikMaliyetKomisyonu }
      if (f.muay.length) { o.muayeneKomisyonu = f.muay.map(km); o.komisyon = o.muayeneKomisyonu }

      const kb = f.kab[f.kab.length - 1];
      if (kb) { S('faturaNo', kb.h['Fatura No']); S('faturaTarihi', dd(kb.h['Fatura Tarihi'])); S('kabulTarihi', dd(kb.h['Kabul Tarihi'])) }

      const kk = {}; Object.keys(k).forEach(a => { if (k[a]) kk[a] = k[a] });
      if (k.kurumAdi) kk.kurumIci = k.kurumAdi;
      if (k.antet) kk.antetSatirlari = k.antet.split('\n').filter(Boolean);
      delete kk.antet;

      return Object.assign({}, useT ? tj : {}, { solLogo: '', sagLogo: '', ustLogo: '', kurumLogo: '' }, kk, o);
    }

    const GITHUB_RAW_BASE = "https://raw.githubusercontent.com/ilyasbozdemir/temin-360-app/main/apps/app-desktop/resources/templates";

    async function fetchGithubTemplate(key, silent = false) {
      try {
        const mUrl = `${GITHUB_RAW_BASE}/${key}/index.mustache`;
        const jUrl = `${GITHUB_RAW_BASE}/${key}/index.mustache.json`;

        const [mRes, jRes] = await Promise.all([
          fetch(mUrl),
          fetch(jUrl).catch(() => null)
        ]);

        if (!mRes.ok) return null;
        const html = await mRes.text();
        let json = '';
        if (jRes && jRes.ok) {
          json = await jRes.text();
        }

        const item = { html, json };
        TPL[key] = item;
        await idbPut(key, item);
        return item;
      } catch (e) {
        if (!silent) console.warn('GitHub raw fetch error:', key, e);
        return null;
      }
    }

    let isDownloadingAll = false;
    async function downloadAllFromGithub() {
      if (isDownloadingAll) return;
      isDownloadingAll = true;

      const btn = document.getElementById('btnGhSync');
      const st = document.getElementById('sbst');
      if (btn) {
        btn.disabled = true;
        btn.textContent = '⏳ İndiriliyor...';
      }

      const catalog = getMergedCatalog();
      const allKeys = [];
      catalog.forEach(g => {
        if (g.key !== 'ozel') {
          g.items.forEach(id => allKeys.push(g.key + '/' + id));
        }
      });

      const total = allKeys.length;
      let successCount = 0;
      let doneCount = 0;

      if (st) st.textContent = `GitHub'a bağlanılıyor... (0/${total})`;

      const batchSize = 4;
      for (let i = 0; i < allKeys.length; i += batchSize) {
        const batch = allKeys.slice(i, i + batchSize);
        await Promise.all(batch.map(async key => {
          const res = await fetchGithubTemplate(key, true);
          doneCount++;
          if (res) successCount++;
          const name = TPL_NAMES[key.split('/')[1]] || key;
          if (st) st.textContent = `İndiriliyor: ${doneCount}/${total} (${name})...`;
        }));
      }

      isDownloadingAll = false;
      if (btn) {
        btn.disabled = false;
        btn.textContent = '☁ GitHub\'dan Tüm Şablonları Otomatik İndir';
      }

      if (st) st.textContent = `✓ ${successCount} şablon GitHub Raw üzerinden başarıyla indirilip tarayıcınıza kaydedildi!`;
      updateSidebarTpl();
      sabShow();
    }

          const p = l.split(/\t|:\s{1,}|;/);
          if (p.length < 2) return;
          const key = F.find(x => x[0].toLowerCase() == p[0].trim().toLowerCase());
          if (key) {
            f[key[0]] = p.slice(1).join(" ").trim();
            n++;
          }
        });
        if (!n) { alert("Eşleşen alan bulunamadı"); return; }
      }
      if (!db.defs) db.defs = DEF0(); if (!db.kurum) db.kurum = {}; if (!db.firmalar) db.firmalar = []; if (!db.katalog) db.katalog = [];
      db.files.forEach(f => { if (!f.sablon) f.sablon = {}; if (!f.ek) f.ek = []; if (!f.tek) f.tek = []; if (!f.id) f.id = uid(); });
      save();
      dlg.close();
      draw();
    }

    try { navigator.storage && navigator.storage.persist && navigator.storage.persist() } catch (e) { }

    // Başlangıçta IndexedDB'deki şablonları yan menüye yükle
    try {
      idbAll().then(res => {
        TPL = res || {};
        updateSidebarTpl();
      });
    } catch (e) { }

    db.files.forEach(syncFiyat);
    db.files.forEach(f => (f.kab || []).forEach(k => { if (!k.id) k.id = uid() }));
    draw();
    routeHash(BOOT_HASH); window.addEventListener('hashchange', () => routeHash());
  </script>
</body>

</html>

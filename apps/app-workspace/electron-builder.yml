appId: dev.ilyasbozdemir.workspace360
productName: Workspace 360
directories:
  buildResources: build
  output: dist-local

files:
  - out/**/*
  - package.json
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'

extraResources:
  - from: resources/
    to: .
    filter:
      - '**/*'

win:
  executableName: Workspace360
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: Workspace 360
  uninstallDisplayName: Workspace 360
  createDesktopShortcut: always
